  <meta name="description" content="구약 히브리 성경 전체의 대단원을 닫는 역대하는 솔로몬 성전의 찬란한 영광으로부터 예루살렘 멸망에 이르는 사백 년 유다 왕조사를 통해 오늘의 성도에게 어떤 영적 부흥의 원리를 제시하는가라는 질문에 대하여, 역대하는 성전 건물 자체가 아니라 살아 계신 하나님의 얼굴을 전심으로 구하며 겸비하여... (집필: 제간사 · 분량: 14,485자 · 꿈디도 열린 학술원)" />
