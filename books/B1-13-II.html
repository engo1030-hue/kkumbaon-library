  <meta name="description" content="이미 사무엘서와 열왕기가 존재함에도 성령께서 바벨론 포로 귀환 공동체에게 역대기를 다시 기록하여 주신 구속사적 목적은 무엇이며 왜 역대상은 무려 아홉 장에 달하는 긴 족보로 문을 여는가라는 질문에 대하여, 역대상은 칠십 년 포로 생활 끝에 초라한 속주 백성으로 돌아와 정체성의 위기를 겪던... (집필: 제간사 · 분량: 16,018자 · 꿈디도 열린 학술원)" />
