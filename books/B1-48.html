  <title>[꿈바온 서가] [성경개관 48권] 갈라디아서(Galatians) 구속사 심층 개관 — '다른 복음은 없나니' 오직 믿음으로 의롭다 하심과 그리스도와 함께 못 박힌 새 자아(갈 2:16, 20), 율법의 저주 속량과 성령의 아홉 열매로 피어나는 참 자유(갈 3:13; 5:1, 22~23) — 꿈바온 디지털 도서관</title>
  <meta name="description" content="바울의 모든 서신 중 유일하게 첫머리 감사 인사를 생략한 채 왜 사도는 &quot;만일 누구든지 너희가 받은 것 외에 다른 복음을 전하면 저주를 받을지어다&quot;(갈 1:9)라고 단호히 선언했는가라는 질문에 대하여, 예수님을 믿는 것만으로는 구원에 부족하니 할례와 모세 율법 준수를 조금이라도 보태야 한다... (집필: 제간사 · 분량: 17,080자 · 꿈디도 열린 학술원)" />
