box\">\n            <div class=\"review-badge an-badge\">🏛️ 1차 원어·사료 DB 검증 내역 (클간사 (Claude · 1차 교차검수 완료) · 안관장 (B등급 승격 확정))</div>\n            <div class=\"review-body\">\n                <p>[B등급 정식 공개 승격 완료] 클간사 필수 보완 5건(콜웰 규칙 설명 정밀화 및 요 1:4 무관사 데오스 오류 삭제, 웨슬리 요 1:4/1:9 주해 귀속 정정, 화합본 요 1:14 대조, 호 로고스 투 데우 범위 한정) 반영·저자 응답 등재 완료 (2026-11-10)</p>\n            </div>\n        </div>\n        <div class=\"review-box\">\n            <div class=\"review-badge ji-badge\">💬 검수자의 학술·신학 질문</div>\n            <div class=\"review-body\">\n                <p>이 논고의 3.3절은 웨슬리를 따라 요한복음 1장의 빛을 모든 사람에게 비추는 선행은총으로 읽습니다. 그렇다면 요 1:9의 &#x27;각 사람에게 비추는 빛&#x27;은 그리스도의 이름을 한 번도 듣지 못한 사람들에게는 무엇을 합니까? 그 빛이 하는 일과, 4.1절이 말하는 &#x27;그리스도의 이름 없이는 구원이 없다&#x27;는 선언은 어떻게 함께 붙들 수 있습니까?</p>\n            </div>\n        </div>\n        <div class=\"review-box\">\n            <div class=\"review-badge an-badge\">✍️ 저자의 응답 및 판본 상태</div>\n            <div class=\"review-body\">\n                <p>요한복음 1장 9절의 참빛은 오직 성육신하신 예수 그리스도 한 분이시므로, 선행은총의 빛 자체가 그리스도 밖의 별도 구원 길이 되는 것이 아니라 모든 사람의 도덕적 양심과 영적 갈망을 일깨워 복음의 은총으로 이끄는 그리스도론적 준비 은총입니다. 따라서 구원의 유일한 근거는 언제나 예수 그리스도의 십자가 보혈(행 4:12)이며, 복음을 듣지 못한 이들에 대한 최종 판단은 공의롭고 자비로우신 하나님의 주권에 맡기되 교회는 땅끝까지 그 빛의 이름을 증언해야 합니다.</p>\n            </div>\n        </div>\n    "}, {"id": "DR009", "hall": "hall2", "hall_name": "제2서가: 성경원어·구속사 검증 총서 (B등급 정식등재)", "title": "빌립보서 2장 그리스도 찬가의 '케노시스(κένωσις, 자기를 비우심)'와 '모르페(μορφή, 본체/형체)' 원어 주해 및 기독론적 함의", "subtitle": "이사야 45장 22~23절, 이사야 52장 13절~53장 12절, 요한복음 13장 3~15절, 고린도후서 8장 9절, 빌립보서 2장 5~11절, 골로새서 2장 9절 / 나지안조스의 그레고리오스 『연설 29(신학 강연 3)』 19절, 칼케돈 공의회 정의문(451), 레오 1세 『토무스(449)』, 요한 크리소스토무스 『빌립보서 강해』, 장 칼빈 『빌립보서 주석』, 존 웨슬리 『신약성경 주해(빌 2:6~7)』, 조셉 라이트풋(1868), 로이 후버(1971)", "author": "제간사 (Gemini)", "date": "2026-11-10", "words": "16,463자", "grade": "B", "grade_badge": "🛡️ 피어리뷰 검증 완료 (정식 공개)", "grade_desc": "[B등급 정식 공개 승격 완료] 클간사 필수 보완 4건(그레고리오스 나지안조스 연설 29:19 정식의 칼케돈 오귀속 정정, 로이 후버 휘트먼 칼리지 소속 정정, 웨슬리 빌 2:7 주해 전문 반영, 사 53:12 칠십인역 가설 완화) 반영·저자 응답 등재 완료 (2026-11-10)", "core_q": "빌립보서 2장 7절의 '자기를 비우심(케노시스)'은 성육신 시 신적 속성을 포기하셨다는 뜻인가 아니면 종의 인성을 취하신 사랑의 낮아지심인가라는 질문에 대하여, 본 연구는 '하르파그모스' 관용구(로이 후버)와 종속 분사 '라본(취하사)'의 문법 구조를 분석하여 성자의 비우심이 신성의 상실이...", "content_html": "<h2>1. 서론: 문제 제기와 역사적·신학적 배경</h2>\n<h3 class=\"kkd-book-h3\">1.1 초대 교회 기독론의 결정체이자 신약 주해의 정점: 빌립보서 2장 5~11절 그리스도 찬가</h3>\n<p class=\"kkd-book-p\">사도 바울이 옥중에서 빌립보 교회에 보낸 서신 중심부에 놓인 빌립보서 2장 5~11절, 이른바 <strong>&#x27;그리스도 찬가(Carmen Christi)&#x27;</strong>는 신약 성경 전체에서 예수 그리스도의 <strong>영원한 선재(Pre-existence)와 완전한 신성, 성육신의 낮아지심(비하), 십자가의 대속적 죽음, 그리고 부활·승천을 통한 만유 위의 높아지심(승귀)</strong>이라는 기독론의 전 과정을 유려한 대칭 구조로 압축해 놓은 구속사의 보석입니다. 주후 50~60년대 초반이라는 극초기 기독교 시대에 이미 예배 공동체 안에서 고백되었던 이 본문은, 예수 그리스도를 구약의 유일하신 여호와 하나님과 동등하신 주(Κύριος, 퀴리오스)로 경배했던 초대 교회의 고기독론(High Christology)을 생생하게 증언합니다.</p>\n<p class=\"kkd-book-p\">동시에 이 여섯 절 안에는 신약 원어학 역사상 깊은 주해적 논의를 불러일으킨 네 개의 핵심 헬라어 신학 어구가 집중되어 있습니다. 첫째는 6절의 <strong>&#x27;모르페 데우(μορφὴ θεοῦ, 하나님의 본체)&#x27;</strong>, 둘째는 6절의 희귀 명사 <strong>&#x27;하르파그모스(ἁρπαγμός, 취할 것 / 이기적으로 이용할 것)&#x27;</strong>, 셋째는 7절의 <strong>&#x27;헤아우톤 에케노센(ἑαυτὸν ἐκένωσεν, 자기를 비워 - 케노시스 κένωσις)&#x27;</strong>과 <strong>&#x27;모르페 둘루(μορφὴ δούλου, 종의 형체)&#x27;</strong>, 그리고 넷째는 9~11절의 <strong>&#x27;모든 이름 위에 뛰어난 이름(τὸ ὄνομα τὸ ὑπὲρ πᾶν ὄνομα - Κύριος)&#x27;</strong>입니다.</p>\n<h3 class=\"kkd-book-h3\">1.2 19세기 근대 케노시스 학파(Kenoticism)의 신성 포기설과 정통 기독론의 변증 과제</h3>\n<p class=\"kkd-book-p\">특히 19세기 중반 독일의 고트프리트 토마시우스(Gottfried Thomasius, 1802~1875)와 게스(W. F. Gess), 영국의 찰스 고어(Charles Gore) 등이 전개한 이른바 <strong>&#x27;근대 케노시스 기독론(Kenotic Christology)&#x27;</strong>은 빌립보서 2장 7절의 &#x27;에케노센(ἐκένωσεν, 비웠다)&#x27; 동사를 존재론적 신성 감축으로 해석하여, 성자께서 성육신하실 때 전지성·전능성·편재성 등 상대적 신적 속성의 일부 또는 전부를 실제로 포기하고 버리셨다는 주장을 펼쳤습니다. 이러한 신성 포기설은 성육신 기간 동안 성자의 완전한 신성과 삼위일체의 불변성(Immutability), 나아가 칼케돈 정통 기독론의 균형을 흔드는 교리적 난제를 야기하였습니다.</p>\n<p class=\"kkd-book-p\">한편 20세기 후반 제임스 던(James D. G. Dunn) 등 일부 학자들은 빌립보서 2장 6~8절을 선재하신 성자의 성육신이 아니라 첫 사람 아담과 대비되는 인간 예수의 윤리적 순종만을 묘사한 것이라는 &#x27;아담 기독론 환원설&#x27;을 제기하기도 하였습니다. 본 연구에서는 빌립보서 2장 5~11절의 헬라어 원문 구문과 이사야서의 구약적 배경을 분석하고, 교부들과 종교개혁자들, 그리고 존 웨슬리의 주해를 통해 성경적 케노시스의 정통 의미를 규명하고자 합니다.</p>\n<div class=\"kkd-table-wrap\"><table class=\"kkd-book-table\">\n<thead><tr><th>헬라어 원어 구문</th><th>음역 및 문법 형태</th><th>대한성서공회 개역개정 번역</th><th>오해된 비평적 해석</th><th>정통 성경신학적·원어적 의미</th></tr></thead><tbody>\n<tr><td><strong>ἐν μορφῇ θεοῦ ὑπάρχων</strong> (6절)</td><td>엔 모르페 데우 휘파르콘 (현재분사)</td><td>근본 하나님의 본체시나</td><td>단순한 외형이나 인간 아담의 형상에 국한함</td><td>영원 전부터 하나님의 고유한 신적 본성과 영광의 지위 안에 존재하심</td></tr>\n<tr><td><strong>οὐχ ἁρπαγμὸν ἡγήσατο</strong> (6절)</td><td>우크 하르파그몬 헤게사토</td><td>하나님과 동등됨을 취할 것으로 여기지 아니하시고</td><td>아직 갖지 못한 신성을 찬탈하려 하지 않음</td><td><strong>이미 소유하신 신적 동등권과 영광을 자기 유익을 위해 움켜쥐고 이용하려 하지 않으심</strong></td></tr>\n<tr><td><strong>ἑαυτὸν ἐκένωσεν</strong> (7절a)</td><td>헤아우톤 에케노센 (제1부정과거 직설법)</td><td>오히려 <strong>자기를 비워</strong></td><td>신적 속성(전지·전능)이나 신성 자체를 상실함</td><td><strong>신성을 유지하신 채 종의 형체를 취하심으로 신적 영광의 현현과 특권을 내려놓으심</strong></td></tr>\n<tr><td><strong>μορφὴν δούλου λαβών</strong> (7절b)</td><td>모르펜 둘루 라본 (부정과거 분사)</td><td>종의 형체를 가지사</td><td>노예처럼 보이는 외적 가장(가현설)</td><td>자기를 비우신 방식: <strong>종의 자리와 실제 인간의 본성을 위격 안에 새로 취하심</strong></td></tr>\n<tr><td><strong>Κύριος Ἰησοῦς Χριστός</strong> (11절)</td><td>퀴리오스 이에수스 크리스토스</td><td>예수 그리스도를 <strong>주</strong>라 시인하여</td><td>로마 황제 칭호의 단순 모방</td><td>구약 이사야 45:23의 유일하신 창조주 <strong>여호와(יהוה, LXX Κύριος)</strong>의 성호를 공유하심</td></tr>\n</tbody></table></div>\n<hr class=\"kkd-book-divider\"/>\n<h2>2. 성경 원문(히브리어·헬라어) 및 구속사적 문맥 주해</h2>\n<h3 class=\"kkd-book-h3\">2.1 6절의 &#x27;모르페 데우(μορφὴ θεοῦ)&#x27;와 &#x27;하르파그모스(ἁρπαγμός)&#x27;의 어휘·문법적 해독</h3>\n<p class=\"kkd-book-p\">빌립보서 2장 6절의 대한성서공회 개역개정판 본문은 다음과 같습니다.</p>\n<blockquote class=\"kkd-book-quote\">&quot;그는 근본 하나님의 본체시나 하나님과 동등됨을 취할 것으로 여기지 아니하시고&quot; (빌립보서 2장 6절)</blockquote>\n<p class=\"kkd-book-p\">헬라어 원문은 <strong>&quot;호스 엔 모르페 데우 휘파르콘 우크 하르파그몬 헤게사토 토 에이나이 이소 데오(ὃς ἐν μορφῇ θεοῦ ὑπάρχων οὐχ ἁρπαγμὸν ἡγήσατο τὸ εἶναι ἴσα θεῷ)&quot;</strong>입니다. 첫째로 동사 <strong>&#x27;휘파르콘(ὑπάρχων)&#x27;</strong>은 단순 존재 동사보다 본래적·선재적 존재 상태를 강조하는 어휘로서(&#x27;근본 ~이시나&#x27;), 성육신 이전부터 성자께서 하나님의 존재 양식 안에 계셨음을 보여 줍니다. 명사 <strong>&#x27;모르페(μορφή)&#x27;</strong>에 관하여 케임브리지의 고전학자 조셉 라이트풋(J. B. Lightfoot, 1868)은 아리스토텔레스 철학 어법에 기대어 가변적 외형을 뜻하는 &#x27;스케마(σχῆμα, 7절 하반절 사람의 모양)&#x27;와 대조되는 &#x27;내적 본질(οὐσία)에서 우러나오는 본질적 형체(essential form)&#x27;로 규정한 고전적 해석을 제시하였습니다. 이후 모이세스 실바(Moisés Silva), 고든 피(Gordon D. Fee), 피터 오브라이언(Peter T. O&#x27;Brien) 등 현대 주석가들은 코이네 헬라어 일반 용례에서 &#x27;모르페&#x27;를 철학적 &#x27;본질&#x27; 단어 자체와 기계적으로 등치시키기보다는 칠십인역의 &#x27;하나님의 가시적 영광(δόξα)과 참된 신적 지위·존재 양식&#x27;을 가리키는 표현으로 읽어야 한다고 정교화하였는데, 어느 쪽으로 읽든 오직 참 하나님만이 지니실 수 있는 신적 영광과 지위 안에 성자께서 선재하셨다는 사실(뒤따르는 <code class=\"kkd-inline-code\">τὸ εἶναι ἴσα θεῷ</code> &quot;하나님과 동등됨&quot;과 상호 설명 관계)을 확고히 증언합니다.</p>\n<p class=\"kkd-book-p\">둘째로 6절 하반절의 난해 어구 <strong>&quot;우크 하르파그몬 헤게사토(οὐχ ἁρπαγμὸν ἡγήσατο, 취할 것으로 여기지 아니하시고)&quot;</strong>에 대해서는, <strong>하버드 대학교에서 신학박사(Th.D.)를 받고 휘트먼 칼리지(Whitman College)에서 봉직한 신약학자 로이 후버(Roy W. Hoover, 1971 <em>HTR</em>)</strong>의 고전 문헌 관용구 연구가 결정적인 전기를 마련하였습니다. 후버는 헬레니즘 문헌에 등장하는 이중 대격 숙어 <code class=\"kkd-inline-code\">ἁρπαγμὸν ἡγεῖσθαι(하르파그몬 헤게이스타이)</code>가 &#x27;아직 갖지 못한 남의 것을 강탈하려 하다&#x27;가 아니라, <strong>&quot;이미 자신이 소유하고 있는 지위나 권리를 자기만의 이익을 위해 움켜쥐고 이기적으로 이용할 대상(something to be taken advantage of / exploited for oneself)으로 여기다&quot;</strong>라는 관용적 의미를 지님을 문헌학적으로 논증하였고, 이 해석은 톰 라이트, 피터 오브라이언, 모이세스 실바 등의 지지를 받아 오늘날 신약학계의 유력한 다수설로 자리 잡았습니다. 즉 성자 그리스도께서는 영원 전부터 하나님과 동등하신 신적 지위를 이미 소유하고 계셨으나, 죄인을 구원하시기 위해 그 신적 권위를 자기 유익을 위한 방패로 고수하지 않으셨다는 뜻입니다(고린도후서 8장 9절 참조).</p>\n<h3 class=\"kkd-book-h3\">2.2 7~8절의 &#x27;헤아우톤 에케노센(ἑαυτὸν ἐκένωσεν)&#x27;과 분사 &#x27;라본(λαβών)&#x27; 구문 및 이사야 53:12 배경 논의</h3>\n<p class=\"kkd-book-p\">이어지는 빌립보서 2장 7~8절은 성자께서 자기를 비우시고 낮추신 방식을 설명합니다.</p>\n<blockquote class=\"kkd-book-quote\">&quot;오히려 자기를 비워 종의 형체를 가지사 사람들과 같이 되셨고 사람의 모양으로 나타나사 자기를 낮추시고 죽기까지 복종하셨으니 곧 십자가에 죽으심이라&quot; (빌립보서 2장 7~8절)</blockquote>\n<p class=\"kkd-book-p\">7절의 주동사 <strong>&quot;헤아우톤 에케노센(ἑαυτὸν ἐκένωσεν, 자기를 비우셨다)&quot;</strong>에는 &#x27;신성이나 신적 속성을 비웠다&#x27;는 별도의 속격 보어가 붙어 있지 않으며, 그 바로 뒤에 부정과거 분사구 <strong>&quot;모르펜 둘루 라본(μορφὴν δούλου λαβών, 종의 형체를 가지사)&quot;</strong>과 <strong>&quot;엔 호모이오마티 안트로폰 게노메노스(ἐν ὁμοιώματι ἀνθρώπων γενόμενος, 사람들과 같이 되사)&quot;</strong>가 이어집니다. 코이네 헬라어 문법에서 주동사 뒤에 오는 부정과거 분사 <code class=\"kkd-inline-code\">λαβών(취하심)</code>과 <code class=\"kkd-inline-code\">γενόμενος(되심)</code>를 주동사와 동시적 사건으로서 비움의 구체적 수단이나 양태(&#x27;종의 형체를 취하심으로써 자기를 비우셨다&#x27;)로 읽는 유력한 주해 전통에 따르면, 성자의 비우심(케노시스)은 신적 본성을 덜어내어 없애는 뺄셈이 아니라 <strong>만유의 주께서 종의 낮은 자리와 실제 인간 본성(참 인성)을 자신의 위격 안에 새로 취하심으로써 하늘 영광의 외적 위엄을 내려놓으신 &#x27;인성 첨가를 통한 비움&#x27;</strong>이라는 신학적 해석이 도출됩니다(요한복음 13장 4~5절에서 예수님께서 주와 선생의 신분을 그대로 지니신 채 겉옷을 벗고 종의 수건을 허리에 두르신 사건과 상통합니다).</p>\n<p class=\"kkd-book-p\">아울러 이 본문의 구약적 배경과 관련하여, 요아킴 예레미아스(Joachim Jeremias) 등 일부 학자들은 이사야 53장 12절(&quot;그가 자기 영혼을 버려 사망에 이르게 하며&quot;, 히브리어 원문 <code class=\"kkd-inline-code\">הֶעֱרָה לַמָּוֶת נַפְשׁוֹ</code> 헤에라 라마웨트 나프쇼 — 동사 עָרָה 아라의 히필형 &#x27;쏟아붓다·비우다&#x27;)의 고난받는 &#x27;여호와의 종&#x27; 본문이 빌립보서 2장 7~8절의 구속사적 배경이 되었을 것이라는 해석 가설을 제안한 바 있습니다. 물론 칠십인역(LXX) 이사야 53장 12절은 <code class=\"kkd-inline-code\">κενόω</code> 대신 <code class=\"kkd-inline-code\">παρεδόθη εἰς θάνατον ἡ ψυχὴ αὐτοῦ(그의 영혼이 사망에 넘겨졌음이라)</code>로 번역하였기에 고든 피(Fee)와 모이세스 실바(Silva) 등은 직접적인 어휘 번역 관계를 단정하는 데에는 신중해야 한다고 지적하지만, 로마 시민권 도시 빌립보에서 가장 수치스러운 노예의 극형이었던 <strong>&#x27;십자가의 죽음(θανάτου δὲ σταυροῦ)&#x27;</strong>까지 복종하신 그리스도의 종 되심이 이사야 52~53장 고난받는 종의 구속 사역과 신학적으로 깊이 공명하고 있음은 널리 인정됩니다.</p>\n<h3 class=\"kkd-book-h3\">2.3 9~11절의 초월적 승귀(ὑπερύψωσεν)와 이사야 45장 23절의 유일신 여호와 성호(Κύριος) 공유</h3>\n<p class=\"kkd-book-p\">성자의 자발적 낮아지심(6~8절)은 9~11절에서 성부 하나님의 주권적 높이심(<code class=\"kkd-inline-code\">διὸ καὶ ὁ θεὸς αὐτὸν ὑπερύψωσεν</code>)으로 역전됩니다.</p>\n<blockquote class=\"kkd-book-quote\">&quot;이러므로 하나님이 그를 지극히 높여 모든 이름 위에 뛰어난 이름을 주사 하늘에 있는 자들과 땅에 있는 자들과 땅 아래에 있는 자들로 모든 무릎을 예수의 이름에 꿇게 하시고 모든 입으로 예수 그리스도를 주라 시인하여 하나님 아버지께 영광을 돌리게 하셨느니라&quot; (빌립보서 2장 9~11절)</blockquote>\n<p class=\"kkd-book-p\">유대 유일신 신앙 안에서 &quot;모든 이름 위에 뛰어난 이름&quot;은 오직 하나님의 고유 성호인 테트라그라마톤 <strong>&#x27;여호와(יהוה, 칠십인역 Κύριος 퀴리오스)&#x27;</strong>뿐입니다. 실제로 사도 바울은 구약에서 가장 엄격한 유일신 선언 본문인 <strong>이사야 45장 22~23절</strong>(&quot;나는 하나님이라 다른 이가 없느니라... 내게 모든 무릎이 꿇겠고 모든 혀가 맹세하리라&quot;)을 그대로 인용하여, 모든 무릎이 꿇는 대상을 <strong>&#x27;예수의 이름&#x27;</strong>에, 모든 입이 고백하는 칭호를 <strong>&#x27;주(Κύριος) 예수 그리스도&#x27;</strong>에 적용하고 그것이 곧 하나님 아버지께 영광을 돌리는 것이라고 선포합니다. 리처드 보컴(Richard Bauckham)이 규명한 바와 같이, 이는 십자가에 죽으시고 부활하신 예수 그리스도께서 유일하신 여호와 하나님의 신적 정체성(Divine Identity) 안에 온전히 포함되심을 보여주는 초기 기독론의 결정적 증거입니다.</p>\n<hr class=\"kkd-book-divider\"/>\n<h2>3. 교회사적 조명과 정통 신학의 통찰</h2>\n<h3 class=\"kkd-book-h3\">3.1 나지안조스의 그레고리오스 정식과 레오 1세 『토무스』·칼케돈 공의회(451)의 양성 연합 교리</h3>\n<p class=\"kkd-book-p\">초대 교부들은 아리우스파(신성 부정), 아폴리나리우스파(온전한 인간 지성 부정), 유티케스파(단성론)를 논박하는 핵심 성경 본문으로 빌립보서 2장 6~8절을 주해하였습니다. 요한 크리소스토무스(John Chrysostom)는 『빌립보서 강해 설교』 제7강(빌 2:5~8, <em>NPNF</em> 1, Vol. 13)에서, 바울이 6절의 &#x27;하나님의 본체(<code class=\"kkd-inline-code\">μορφὴ θεοῦ</code>)&#x27;와 7절의 &#x27;종의 형체(<code class=\"kkd-inline-code\">μορφὴ δούλου</code>)&#x27;에 동일한 단어 &#x27;모르페&#x27;를 사용한 점을 지적하며, 그리스도의 종의 형체가 가현설적 허상이 아닌 참된 인간 본성인 것과 마찬가지로 하나님의 본체 또한 참된 신적 본질임을 논증하였습니다.</p>\n<p class=\"kkd-book-p\">특히 성육신과 케노시스의 관계를 요약한 교부 신학의 유명한 정식은 4세기 갑바도기아 교부 <strong>나지안조스의 그레고리오스(Gregory of Nazianzus)</strong>가 <strong>『연설 29(신학 강연 제3편, Oratio 29)』 제19절</strong>에서 정립한 명제인 <strong>&quot;그분은 자신이 본래 있으셨던 것(신성)은 그대로 머물러 유지하시고, 자신이 본래 아니셨던 것(인성)을 새로 취하셨다(ὃ μὲν ἦν, διέμεινεν· ὃ δὲ οὐκ ἦν, προσέλαβεν)&quot;</strong>였으며, 이 정식은 아우구스티누스를 비롯한 서방 라틴 교부 전통(<code class=\"kkd-inline-code\">Manens quod erat, assumpsit quod non erat</code>)에서도 폭넓게 공유되었습니다. 이어 레오 1세(Leo the Great)는 449년 『플라비아누스에게 보낸 서신(토무스, Epistola 28)』 제3~4장에서 빌립보서 2장 6~7절을 해설하며 성자의 비우심은 권능의 상실이 아니라 긍휼의 굽어보심으로서 보이지 않으시는 분이 종의 형체를 취하여 무한한 위엄을 가리셨으되 신적 본성은 조금도 잃지 않으셨다고 천명하였습니다. 그리고 이를 최종 공의회 신조로 확립한 <strong>451년 칼케돈 공의회 정의문(Chalcedonian Definition)</strong>은 한 분 주 예수 그리스도께서 신성에 있어서는 완전하시고 인성에 있어서도 완전하사 두 본성(신성과 인성)이 <strong>&quot;혼동 없이(ἀσυγχύτως), 변화 없이(ἀτρέπτως), 분할 없이(ἀδιαιρέτως), 분리 없이(ἀχωρίστως)&quot;</strong> 한 위격(ὑπόστασις) 안에 연합되셨음을 선포하였습니다.</p>\n<h3 class=\"kkd-book-h3\">3.2 마르틴 루터와 장 칼빈의 주해 및 17세기 정통주의의 비하·승귀 체계화</h3>\n<p class=\"kkd-book-p\">16세기 종교개혁자 마르틴 루터는 빌립보서 2장 5~11절을 &#x27;십자가 신학(Theologia Crucis)&#x27;의 핵심 본문으로 삼아, 힘과 영광을 움켜쥐려 하는 타락한 인간의 교만과 대조하여 참 하나님이신 그리스도께서 종과 십자가 고난의 모습 아래 자신의 신적 영광을 숨기셨음을 강조하였습니다.</p>\n<p class=\"kkd-book-p\">장 칼빈 역시 『빌립보서 주석(1548)』 2장 6~11절과 『기독교강요』 제2권 13~16장에서 그리스도께서는 신성 자체를 없애실 수 없으셨으나 사람들 앞에서 신적 영광의 광채를 육체의 연약함 아래 잠시 감추심으로써 스스로 낮아지셨다고 주해하였습니다. 이러한 칼빈과 루터의 빌립보서 2장 주해는 이후 <strong>17세기 개신교(루터교 및 개혁파) 정통주의 신학</strong>에서 그리스도의 두 상태인 <strong>&#x27;비하의 신분(Status Humiliationis: 성육신·고난·십자가 죽음·장사)&#x27;</strong>과 <strong>&#x27;승귀의 신분(Status Exaltationis: 부활·승천·하나님 우편 좌정·재림)&#x27;</strong> 교리 틀을 정식화하는 주해적 기초를 놓았습니다.</p>\n<h3 class=\"kkd-book-h3\">3.3 존 웨슬리의 『신약성경 주해(빌 2:6~7)』 실제 원문과 &#x27;영광의 가림(Veiling)&#x27; 해석</h3>\n<p class=\"kkd-book-p\">18세기 존 웨슬리(John Wesley)는 『신약성경 주해(Explanatory Notes upon the New Testament, 1755)』 빌립보서 2장 6~7절에서 정통 기독론의 울타리 안에서 &#x27;모르페&#x27;와 &#x27;케노시스&#x27;를 정밀하게 풀이하였습니다. 먼저 <strong>2장 6절</strong>의 &#x27;하나님의 본체(<code class=\"kkd-inline-code\">μορφὴ θεοῦ</code>)&#x27;에 대하여 웨슬리는 <strong>&quot;본질적 형체... 하나님의 비공유적 본성(essential form ... the incommunicable nature of God)&quot;</strong>이라고 주해하여 성자의 완전한 신성을 확증하였습니다.</p>\n<p class=\"kkd-book-p\">이어 <strong>2장 7절</strong>의 &quot;자기를 비워(<code class=\"kkd-inline-code\">Emptied himself</code>, <code class=\"kkd-inline-code\">ἑαυτὸν ἐκένωσεν</code>)&quot;에 대한 웨슬리의 주해는 앞뒤 두 문장이 서로를 해석하는 구조로 되어 있어 반드시 전문의 맥락을 함께 읽어야 합니다. 웨슬리는 앞부분에서 <strong>&quot;승귀 때 다시 받으신 그 신적 충만을 [비우셨다](Of that divine fulness, which he received again at his exaltation)&quot;</strong>라고 적은 뒤, 곧바로 이어지는 뒷문장에서 그 의미가 신적 본성의 상실이 아님을 이렇게 해명합니다. <strong>&quot;비록 그 모든 충만이 여전히 그분 자신 안에 머물러 있었으나, 사람들과 천사들의 시야로부터 그 충만을 가리셨기에 마치 비어 계신 것처럼 보이셨다. 참으로 그분은 높고 위대하게 나타나시는 것을 거절하셨다(Though all fulness dwelt in him, yet it was veiled from the sight of men and angels; yea, he refused to appear high and great).&quot;</strong> 즉 웨슬리는 &#x27;충만을 비우셨다&#x27;는 표현을 신성 자체의 축소가 아니라 <strong>&#x27;신적 충만과 영광의 외적 현현을 육신의 베일로 가리심(veiling)&#x27;</strong>으로 풀어냄으로써 정통 기독론을 견지하였습니다.</p>\n<p class=\"kkd-book-p\">아울러 존 웨슬리는 빌립보서 2장 12~13절을 본문으로 한 표준 설교 제85편 『우리 자신의 구원을 이룸에 관하여』와 『그리스도인의 완전에 관한 평이한 해설(A Plain Account of Christian Perfection)』 전반에서 빌립보서 2장 5절(&quot;너희 안에 이 마음을 품으라 곧 그리스도 예수의 마음이니&quot;)을 인용하며, 그리스도인의 성화란 자기를 비워 종의 자리를 택하신 그리스도의 겸손하고 온유한 사랑의 마음을 성령으로 덧입는 것이라고 가르쳤습니다. 동생 찰스 웨슬리가 1738년 회심 직후 발표한 영문 찬송시 『And Can It Be That I Should Gain』 원시 제3연에서 <strong>&quot;사랑 외에 모든 것을 비우시고 아담의 가련한 후손을 위해 피 흘리셨네(Emptied Himself of all but love, And bled for Adam&#x27;s helpless race)&quot;</strong>라고 노래한 구절 또한 이러한 성육신 사랑의 감격을 시적으로 응축한 고백입니다.</p>\n<hr class=\"kkd-book-divider\"/>\n<h2>4. 현대적 쟁점 변증과 기독교 세계관적 대안</h2>\n<h3 class=\"kkd-book-h3\">4.1 19세기 토마시우스류의 케노시스주의(신성 상실설)에 대한 정통 신학적 비평</h3>\n<p class=\"kkd-book-p\">19세기 토마시우스 등이 주장한 존재론적 케노시스주의(성육신 기간 중 전지·전능·편재 속성의 포기설)에 대하여 찰스 핫지, 헤르만 바빙크(『개혁교의학』 제3권), 도널드 매클라우드(Donald Macleod), 토마스 오든(Thomas C. Oden) 등 정통 조직신학자들은 두 가지 핵심 논거로 비평하였습니다. 첫째, 하나님의 본질적 속성은 하나님의 존재 자체와 분리하여 떼어 놓을 수 있는 부속물이 아니므로 신적 속성의 상실은 곧 참 신성의 상실과 삼위일체의 변질을 초래합니다. 둘째, 골로새서 1장 17절(&quot;만물이 그 안에 함께 섰느니라&quot;)과 2장 9절(&quot;그 안에는 신성의 모든 충만이 육체로 거하시고&quot;)이 증언하듯, 성육신하신 그리스도 안에는 육신을 입으신 상태에서도 신성의 충만이 거하고 계셨습니다.</p>\n<h3 class=\"kkd-book-h3\">4.2 권력과 기득권 독점(&#x27;하르파그모스&#x27;)의 세속 문화에 맞선 십자가 제자도</h3>\n<p class=\"kkd-book-p\">또한 성경신학적 관점에서 볼 때(창세기 3장 5절 칠십인역의 <code class=\"kkd-inline-code\">ἔσεσθε ὡς θεοί</code>와 빌립보서 2장 6절의 <code class=\"kkd-inline-code\">ἴσα θεῷ</code>는 직접 어구가 다르므로 제임스 던이나 톰 라이트 등이 제시한 아담-그리스도 대조는 주해적·신학적 해석 틀로 볼 수 있음), 피조물에 불과하면서도 스스로 하나님처럼 높아지려 했던 타락한 인류의 교만과 대조하여, 참 하나님이신 예수 그리스도께서 동등됨의 특권을 이기적으로 움켜쥐지 않으시고 종의 자리와 십자가 죽음까지 내려가신 모습은 오늘날 자기 과시와 기득권 경쟁에 매몰된 세속 문화를 치유하는 거룩한 제자도의 표준을 제시합니다(마태복음 20장 28절, 23장 11~12절).</p>\n<hr class=\"kkd-book-divider\"/>\n<h2>5. 결론: 강단 설교와 성도의 삶을 위한 목회적 적용</h2>\n<h3 class=\"kkd-book-h3\">5.1 가장 낮은 십자가에서 가장 높은 보좌로 이어진 구속의 길</h3>\n<p class=\"kkd-book-p\">기독교 영성 전통의 고전 표어인 <strong>&quot;십자가를 통하여 빛(영광)으로(Per Crucem ad Lucem)&quot;</strong>라는 말처럼, 빌립보서 2장 5~11절 그리스도 찬가는 하늘 영광(6절)에서 종의 형체(7절)와 골고다 십자가 죽음(8절)의 가장 낮은 자리까지 내려가신 성자 예수 그리스도께서 부활과 승천을 통해 만유가 무릎 꿇는 만왕의 왕, 만주의 주(9~11절)로 등극하신 구속사의 대역전을 선포합니다.</p>\n<h3 class=\"kkd-book-h3\">5.2 강단 설교와 성도의 일상을 위한 세 가지 목회적 적용</h3>\n<p class=\"kkd-book-p\">첫째, 목회자와 교회 직분자들은 빌립보서 2장 5절(&quot;너희 안에 이 마음을 품으라 곧 그리스도 예수의 마음이니&quot;)을 사역의 거울로 삼아, 군림하는 권력이 아니라 내 권리와 자존심을 내려놓고 연약한 지체를 섬기는 종의 마음을 품어야 합니다.</p>\n<p class=\"kkd-book-p\">둘째, 가정과 교회 안에서 다툼이나 허영(빌립보서 2장 3절)이 일어날 때, 하늘 보좌의 특권을 내려놓으신 그리스도의 십자가 겸손을 바라보며 나보다 남을 낫게 여기는 화평의 사람이 되어야 합니다.</p>\n<p class=\"kkd-book-p\">셋째, 주님의 뜻을 따라 순종하며 섬기느라 낮아진 자리에 처한 성도는 빌립보서 2장 9절(&quot;이러므로 하나님이 그를 지극히 높여&quot;)의 약속을 신뢰하며 끝까지 그리스도와 함께 믿음의 길을 걸어가기를 소망합니다.</p>\n<h3 class=\"kkd-book-h3\">5.3 참고 사료 및 학술 문헌 목록</h3>\n<ul class=\"kkd-book-list\">\n<li><strong>1차 성경 원문 및 교부·고전 신학 문헌:</strong></li>\n<li>Holmes, Michael W., ed. (2010), <em>The Greek New Testament: SBL Edition (SBLGNT)</em>, Atlanta: Society of Biblical Literature.</li>\n<li>Gregory of Nazianzus (2002), <em>On God and Christ: The Five Theological Orations and Two Letters to Cledonius</em> (Oration 29.19), trans. Frederick Williams and Lionel Wickham, Crestwood: St Vladimir&#x27;s Seminary Press.</li>\n<li><em>The Chalcedonian Definition (451)</em> &amp; Leo the Great, <em>Tome of Leo (Epistola 28 ad Flavianum, 449)</em>, in <em>Nicene and Post-Nicene Fathers (NPNF)</em>, Series 2, Vol. 14 &amp; Vol. 12.</li>\n<li>Chrysostom, John, <em>Homilies on the Epistle of St. Paul to the Philippians</em> (Homily 7), in <em>NPNF</em>, Series 1, Vol. 13.</li>\n<li>Calvin, John (1965), <em>The Epistles of Paul the Apostle to the Galatians, Ephesians, Philippians and Colossians</em>, trans. T. H. L. Parker, Grand Rapids: Eerdmans.</li>\n<li>Wesley, John (1755), <em>Explanatory Notes upon the New Testament</em> (Philippians 2:5~11), London: William Bowyer.</li>\n<li><strong>현대 성경 원어학 및 기독론 연구서:</strong></li>\n<li>Lightfoot, J. B. (1868), <em>St. Paul&#x27;s Epistle to the Philippians</em>, London: Macmillan.</li>\n<li>Hoover, Roy W. (1971), &quot;The Harpagmos Enigma: A Philological Solution&quot;, <em>Harvard Theological Review</em> 64, no. 1: 95~119.</li>\n<li>O&#x27;Brien, Peter T. (1991), <em>The Epistle to the Philippians: A Commentary on the Greek Text</em>, NIGTC, Grand Rapids: Eerdmans.</li>\n<li>Fee, Gordon D. (1995), <em>Paul&#x27;s Letter to the Philippians</em>, NICNT, Grand Rapids: Eerdmans.</li>\n<li>Silva, Moisés (2005), <em>Philippians</em>, 2nd ed., BECNT, Grand Rapids: Baker Academic.</li>\n<li>Bauckham, Richard (2008), <em>Jesus and the God of Israel</em>, Grand Rapids: Eerdmans.</li>\n<li>Macleod, Donald (1998), <em>The Person of Christ</em>, Downers Grove: InterVarsity Press.</li>\n</ul>\n<hr class=\"kkd-book-divider\"/>", "peer_review_html": "\n        <div class=\"review-box\">\n            <div class=\"review-badge an-badge\">🏛️ 1차 원어·사료 DB 검증 내역 (클간사 (Claude · 1차 교차검수 완료) · 안관장 (B등급 승격 확정))</div>\n            <div class=\"review-body\">\n                <p>[B등급 정식 공개 승격 완료] 클간사 필수 보완 4건(그레고리오스 나지안조스 연설 29:19 정식의 칼케돈 오귀속 정정, 로이 후버 휘트먼 칼리지 소속 정정, 웨슬리 빌 2:7 주해 전문 반영, 사 53:12 칠십인역 가설 완화) 반영·저자 응답 등재 완료 (2026-11-10)</p>\n            </div>\n        </div>\n        <div class=\"review-box\">\n            <div class=\"review-badge ji-badge\">💬 검수자의 학술·신학 질문</div>\n            <div class=\"review-body\">\n                <p>이 논고는 성육신하신 그리스도가 신성의 모든 속성을 온전히 지니셨다고 말합니다. 그런데 마가복음 13장 32절은 &#x27;그 날과 그 때는 … 아들도 모르고 오직 아버지만 아시느니라&#x27;고 하고, 누가복음 2장 52절은 예수께서 &#x27;지혜와 키가 자라가며&#x27; 하나님과 사람에게 더 사랑스러워 가셨다고 기록합니다. 신적 속성을 하나도 비우지 않았다면 이 본문들은 어떻게 읽어야 합니까? &#x27;가림&#x27;이라는 설명으로 충분합니까, 아니면 인성의 한계를 따로 말해야 합니까?</p>\n            </div>\n        </div>\n        <div class=\"review-box\">\n            <div class=\"review-badge an-badge\">✍️ 저자의 응답 및 판본 상태</div>\n            <div class=\"review-body\">\n                <p>단순히 신적 영광을 외적으로 가리셨다(veiling)는 설명만으로는 충분하지 않으며, 칼케돈 정통 양성 기독론과 교부들(아타나시우스·그레고리오스 나지안조스·레오 1세의 속성 교류 교리)을 따라 그리스도께서 취하신 &#x27;완전하고 참된 인성(인간 영혼과 인간 지성)의 자연적 유한성&#x27;을 함께 말해야 합니다. 성자께서는 신성의 전지성을 잃지 않으셨으나, 우리와 똑같은 참된 인간 지성 안에서 실제로 배우고 자라가시며 성부께 복종하는 인성의 한계를 기꺼이 사셨습니다.</p>\n            </div>\n        </div>\n    "}, {"id": "DR010", "hall": "hall2", "hall_name": "제2서가: 성경원어·구속사 검증 총서 (B등급 정식등재)", "title": "구약의 '카파르(כָּפַר, 속죄하다)'·속죄소(כַּפֹּרֶת)와 신약 히브리서·로마서의 '힐라스테리온(ἱλαστήριον, 화목제물)' 구속사 관통 연구", "subtitle": "출애굽기 25장 17~22절, 레위기 16장 5~22절, 레위기 17장 11절, 이사야 53장 10절, 로마서 3장 24~26절, 히브리서 2장 17절, 히브리서 9장 5~14절, 요한일서 2장 2절, 4장 10절 / 『디오그네투스에게 보내는 편지』 제9장(Holmes 판), 안셀무스 『왜 하나님이 사람이 되셨는가』, 장 칼빈 『기독교강요』 2.16.3~4, 존 웨슬리 『신약성경 주해(롬 3:25; 요일 2:2)』, C. H. 다드(1935), 레온 모리스(1955/1965), 제이콥 밀그롬(1991), 고든 웬함(1979), 더글러스 무(2018)", "author": "제간사 (Gemini)", "date": "2026-11-10", "words": "17,930자", "grade": "B", "grade_badge": "🛡️ 피어리뷰 검증 완료 (정식 공개)", "grade_desc": "[B등급 정식 공개 승격 완료] 클간사 필수 보완 5건(시 32:1 카사[H3680]와 카파르 구별, 창 6:14 동음이의 어근 구분, 웨슬리 롬 3:25·요일 2:2 실제 주해 교체, 디오그네투스 9장 원문 대조, 학자별 주장 세분화) 반영·저자 응답 등재 완료 (2026-11-10)", "core_q": "구약 대속죄일의 피 뿌림('카파르')과 지성소 '속죄소(카포레트)'는 신약 로마서 3장 25절과 히브리서 9장의 '힐라스테리온'에서 어떻게 성취되었는가라는 질문에 대하여, 본 연구는 성소 오염 정화와 진노 유화적 속전이 결합된 구약 속죄 신학이 성부의 사랑 안에서 스스로 화목제물과 참된 속...", "content_html": "<h2>1. 서론: 문제 제기와 역사적·신학적 배경</h2>\n<h3 class=\"kkd-book-h3\">1.1 성경 전체 구속사의 심장부: 피 흘림을 통한 속죄(Atonement)의 신비</h3>\n<p class=\"kkd-book-p\">창세기 3장 21절에서 범죄한 아담과 하와의 수치를 가리기 위해 지어 입히신 가죽옷으로부터 시작하여, 출애굽기 12장의 유월절 어린양의 피, 레위기 16장의 대속죄일(יוֹם הַכִּפֻּרִים, 욤 하키푸림) 성막 제사, 이사야 53장의 속건제물(אָשָׁם)로 드려진 여호와의 종을 거쳐, 골고다 십자가에서 흘리신 하나님의 어린양 예수 그리스도의 보혈(요한복음 1장 29절, 히브리서 9장 12절)과 요한계시록 5장 9절의 어린양의 새 노래에 이르기까지 성경 66권 전체를 관통하는 구속사의 중심축은 <strong>&#x27;피를 통한 대속적 속죄(Vicarious Blood Atonement)&#x27;</strong>입니다. 히브리서 9장 22절(&quot;율법을 따라 거의 모든 물건이 피로써 정결하게 되나니 피 흘림이 없은즉 사함이 없느니라&quot;)이 선언하듯 기독교 복음의 핵심은 십자가 보혈을 통한 죄 사함과 하나님과의 화목에 있습니다.</p>\n<p class=\"kkd-book-p\">이 구약의 속죄 제의와 신약의 십자가 구속을 언어학적·신학적으로 직접 이어 주는 두 고리가 바로 구약 히브리어 동사 <strong>&#x27;카파르(כָּפַר, 속죄하다)&#x27;</strong>와 파생 명사 <strong>&#x27;카포레트(כַּפֹּרֶת, 속죄소)&#x27;</strong>, 그리고 칠십인역(LXX)과 신약 로마서 3장 25절·히브리서 9장 5절이 이를 번역한 헬라어 <strong>&#x27;힐라스테리온(ἱλαστήριον, 화목제물·속죄소)&#x27;</strong> 및 <strong>&#x27;힐라스모스(ἱλασμός, 요일 2:2; 4:10)&#x27;</strong>입니다.</p>\n<h3 class=\"kkd-book-h3\">1.2 20세기 신약학의 핵심 논쟁: 다드(C. H. Dodd)의 &#x27;죄책 제거설(Expiation)&#x27; 대 모리스(Leon Morris)의 &#x27;진노 유화설(Propitiation)&#x27;</h3>\n<p class=\"kkd-book-p\">20세기 영미 신약학계에서는 헬라어 &#x27;힐라스테리온(ἱλαστήριον)&#x27;과 &#x27;힐라스코마이(ἱλάσκομαι)&#x27; 어군의 의미를 둘러싸고 중대한 논쟁이 전개되었습니다. 영국의 성서학자 찰스 해럴드 다드(C. H. Dodd, 1884~1973)는 1931년 논문과 단행본 『성경과 헬라인(The Bible and the Greeks, 1935)』에서, 칠십인역과 신약의 &#x27;힐라스테리온&#x27; 어군에는 죄에 대한 하나님의 거룩한 진노를 유화시킨다는 <strong>&#x27;진노 유화(Propitiation)&#x27;</strong> 의미가 없으며 오직 인간의 죄책과 오염을 씻어 없앤다는 <strong>&#x27;죄책 제거·정화(Expiation)&#x27;</strong>의 의미만 있다고 주장하였습니다.</p>\n<p class=\"kkd-book-p\">이에 대하여 호주의 복음주의 신약학자 레온 모리스(Leon Morris, 『사도들의 십자가 설교 The Apostolic Preaching of the Cross』, 초판 1955 / 개정3판 1965)와 로저 니콜(Roger R. Nicole, 1955)은 칠십인역 전체의 &#x27;카파르&#x27; 번역 용례와 구약·신약의 진노 문맥을 정밀 재검토하여 다드의 통계에서 누락된 진노 유화 본문들(창 32:20, 민 16:46, 민 25:11~13, 롬 1:18~3:25 등)을 제시하였습니다. 모리스와 존 스토트(John Stott)는 성경의 속죄가 변덕스러운 이교 신에게 인간이 뇌물을 바치는 행위와는 전혀 다르지만, 죄를 미워하시는 하나님의 거룩한 진노(ὀργὴ θεοῦ, 로마서 1장 18절)를 하나님 자신이 친히 내어주신 독생자의 대속 보혈로 공의롭게 해결하시고(Propitiation) 동시에 죄의 오염과 죄책을 정결케 제거하시는(Expiation) 두 차원을 함께 포괄함을 논증하였습니다.</p>\n<div class=\"kkd-table-wrap\"><table class=\"kkd-book-table\">\n<thead><tr><th>구속사적 단계 및 원어</th><th>히브리어 / 헬라어 표기</th><th>어원 가설 및 제의적 핵심 의미</th><th>대표 성경 본문</th><th>구속사적 성취 및 신학적 함의</th></tr></thead><tbody>\n<tr><td><strong>카파르 (구약 제의 동사)</strong></td><td><strong>כָּפַר</strong> (<code class=\"kkd-inline-code\">כפר I</code>, H3722a, 피엘형 <strong>כִּפֶּר</strong> 키페르)</td><td>아카드어 <em>kuppuru</em>(닦아 정화하다) / 속전(כֹּפֶר) 대속설 / 아랍어 <em>kafara</em>(덮다) 가설</td><td>창 32:20, 출 30:12, 레 16:16, 레 17:11, 시 78:38</td><td>생명이 담긴 피(דָּם)를 통해 오염을 정결케 하고 속전을 치러 하나님의 진노로부터 생명을 건짐</td></tr>\n<tr><td><strong>카포레트 (구약 명사)</strong></td><td><strong>כַּפֹּרֶת</strong> (Kapporeth, 속죄소·시은좌)</td><td>언약궤 위 두 그룹 사이에 놓인 순금 속죄판</td><td>출 25:17~22, 출 37:6, 레 16:14~15, 민 7:89</td><td>대속죄일(욤 키푸르)에 대제사장이 속죄제 피를 뿌려 하나님과 백성이 만나는 속죄의 자리</td></tr>\n<tr><td><strong>힐라스테리온 (LXX &amp; 신약)</strong></td><td><strong>ἱλαστήριον</strong> (Hilastērion)</td><td>모세오경 LXX에서 &#x27;카포레트(속죄소)&#x27;를 번역한 어휘 / 화목제물</td><td>출 25:17(LXX), 레 16:14(LXX), <strong>롬 3:25, 히 9:5</strong></td><td><strong>예수 그리스도의 피 흘리심이 곧 참된 속죄소이자 하나님의 공의를 만족시키는 화목제물임</strong></td></tr>\n<tr><td><strong>힐라스코마이 / 힐라스모스</strong></td><td><strong>ἱλάσκομαι / ἱλασμός</strong></td><td>죄를 속하여 하나님의 진노를 풀고 화목을 이루다</td><td>눅 18:13, 히 2:17, 요일 2:2, 요일 4:10</td><td>우리를 사랑하신 하나님께서 친히 아들을 온 세상의 죄를 위한 화목제물로 보내심</td></tr>\n</tbody></table></div>\n<hr class=\"kkd-book-divider\"/>\n<h2>2. 성경 원문(히브리어·헬라어) 및 구속사적 문맥 주해</h2>\n<h3 class=\"kkd-book-h3\">2.1 구약의 &#x27;카파르(כָּפַר)&#x27; 어원 가설 구분과 레위기 17장 11절 피의 속죄 원리 주해</h3>\n<p class=\"kkd-book-p\">구약 성경에서 제사장이 피를 통해 죄와 부정을 속하는 제의 행위를 나타낼 때에는 구약 마소라 본문(OSHB 및 HALOT 기준)에 약 102회 등장하는 동사 <strong>&#x27;카파르(כָּפַר, H3722a)&#x27;</strong>의 피엘(Piel) 어간 <strong>&#x27;키페르(כִּפֶּר, 속죄하다)&#x27;</strong>가 주로 사용됩니다. 먼저 원어 사전학적으로 주의할 점은 두 가지입니다. 첫째, 시편 32편 1절(&quot;허물의 사함을 받고 자신의 죄가 가려진 자는 복이 있도다&quot;)에서 &#x27;가려진&#x27;에 쓰인 히브리어는 &#x27;카파르&#x27;가 아니라 &#x27;덮다·가리다&#x27;를 뜻하는 별개 동사 <strong>&#x27;카사(כָּסָה, H3680 — 분사형 כְּסוּי 케수이)&#x27;</strong>로서 제의적 속죄 동사 &#x27;카파르&#x27;(예: 시편 65편 3절, 78편 38절 &quot;그들의 죄악을 속하시고&quot; יְכַפֵּר)와 의미론적 유의 관계를 이룹니다. 둘째, 창세기 6장 14절에서 노아 방주에 역청(כֹּפֶר)을 칠하다(<code class=\"kkd-inline-code\">וְכָפַרְתָּ</code>)라고 할 때 쓰인 동사는 현대 히브리어 사전학(HALOT, OSHB)에서 제의적 속죄 동사(<code class=\"kkd-inline-code\">כפר I</code>, H3722a)와 구별되는 <strong>동음이의 어근(<code class=\"kkd-inline-code\">כפר II</code>, H3722b, 역청을 바르다)</strong>으로 분류됩니다.</p>\n<p class=\"kkd-book-p\">제의적 속죄 동사 <strong><code class=\"kkd-inline-code\">כפר I</code>(&#x27;키페르&#x27;)</strong>의 어원과 관련하여 고대 셈족 비교언어학계에서는 크게 세 가지 가설이 제안되어 왔습니다(제임스 바가 경고한 &#x27;어원적 총체 전이&#x27;를 피하기 위해 이 세 갈래는 한 단어에 항상 동시에 들어 있는 뜻이 아니라 학계의 어원 가설들로 보아야 하며 실제 의미는 문맥 용례에서 결정됩니다). 첫째는 아랍어 <em>kafara</em>와 연결하여 &#x27;덮다·가리다&#x27;로 보는 전통적 가설이고, 둘째는 바벨론-아카드어 제의 문헌의 <strong>&#x27;쿠푸루(<em>kuppuru</em>, 문질러 닦아내다·제의적 오염을 정화하다)&#x27;</strong>와 연결하는 가설로서 레위기 16장 16절처럼 성소의 부정을 정결케 하는 제의 문맥에서 오늘날 다수 구약학자들의 지지를 받고 있으며, 셋째는 출애굽기 21장 30절, 30장 12절, 민수기 35장 31~32절의 법률 명사 <strong>&#x27;코페르(כֹּפֶר, 생명을 건지기 위해 지불하는 속전·몸값, ransom)&#x27;</strong>에서 파생된 동사로 보아 &#x27;속전을 치러 대속하고 진노를 풀다&#x27;(창 32:20, 민 25:11~13)로 해석하는 가설입니다. 특히 최근 제이 스클라(Jay Sklar, 2005) 등의 레위기 연구는 모세오경 문맥 안에서 &#x27;키페르&#x27;가 아카드어 계통의 <strong>&#x27;정화(purgation)&#x27;</strong> 기능과 히브리 법률 명사 &#x27;코페르&#x27;의 <strong>&#x27;속전 지불(ransom)&#x27;</strong> 기능을 통합한 &#x27;정화시키는 속전(Purifying Ransom)&#x27;으로 작동함을 설득력 있게 제시하였습니다.</p>\n<p class=\"kkd-book-p\">구약 희생 제사 신학의 핵심 원리인 <strong>레위기 17장 11절</strong>을 살펴보겠습니다.</p>\n<blockquote class=\"kkd-book-quote\">&quot;육체의 생명은 피에 있음이라 내가 이 피를 너희에게 주어 제단에 뿌려 너희의 생명을 위하여 속죄하게 하였나니 생명이 피에 있으므로 피가 죄를 속하느니라&quot; (레위기 17장 11절)</blockquote>\n<p class=\"kkd-book-p\">히브리어 원문 <strong>&quot;키 네페쉬 하바사르 바담 히 바아니 네타티브 라켐 알 하미즈베아흐 레카페르 알 나프쇼테켐 키 하담 후 바네페쉬 예카페르(כִּי נֶפֶשׁ הַבָּשָׂר בַּדָּם הִוא וַאֲנִי נְתַתִּיו לָכֶם עַל־הַמִּזְבֵּחַ לְכַפֵּר עַל־נַפְשֹׁתֵיכֶם כִּי־הַדָּם הוּא בַּנֶּפֶשׁ יְכַפֵּר)&quot;</strong>에서 두 가지 핵심 진리가 드러납니다. 첫째, <strong>&quot;바아니 네타티브 라켐(וַאֲנִי נְתַתִּיו לָכֶם, 내가 그 피를 너희에게 주었노라)&quot;</strong>이라는 1인칭 강조 구문이 보여 주듯, 속죄는 인간이 신을 매수하기 위해 고안한 뇌물이 아니라 거룩하신 하나님께서 죄인의 생명을 살리시기 위해 친히 제정하여 주신 은혜의 선물입니다. 둘째, 마지막 구절 <strong>&quot;바네페쉬 예카페르(בַּנֶּפֶשׁ יְכַפֵּר)&quot;</strong>의 전치사 <strong>&#x27;베(בְּ)&#x27;</strong> 해석을 두고 구약학계에서는 &#x27;수단·도구의 전치사(피 안에 담긴 생명의 힘을 수단으로 하여 죽음의 부정을 씻음 — 제이콥 밀그롬 Jacob Milgrom 등)&#x27;로 읽는 견해와 &#x27;대가·교환의 전치사(Beth Pretii: 생명이 생명을 대신하는 대속의 몸값으로 속죄를 이룸 — 고든 웬함 Gordon J. Wenham 등)&#x27;로 읽는 견해가 함께 논의되며, 문맥상 앞 구절의 <code class=\"kkd-inline-code\">לְכַפֵּר עַל־נַפְשֹׁתֵיכֶם</code>(&quot;너희 생명을 속하기 위하여&quot;, 출 30:15~16의 속전 어구와 동일)과 연결할 때 생명의 대속적 가치가 분명히 드러납니다.</p>\n<h3 class=\"kkd-book-h3\">2.2 지성소 언약궤 위의 &#x27;카포레트(כַּפֹּרֶת, 속죄소)&#x27;와 대속죄일(레 16장)의 신학적 의미</h3>\n<p class=\"kkd-book-p\">출애굽기 25장 17~22절은 지성소 언약궤 위에 얹는 두 그룹 달린 순금 판을 히브리어로 <strong>&#x27;카포레트(כַּפֹּרֶת, 개역개정: 속죄소, 루터역: Gnadenstuhl, 틴데일·KJV: Mercy Seat)&#x27;</strong>라고 명명합니다. 이는 피엘 동사 &#x27;키페르(속죄하다)&#x27;에서 파생된 명사로서 <strong>&#x27;속죄와 화목이 이루어지는 거룩한 자리&#x27;</strong>를 뜻합니다.</p>\n<blockquote class=\"kkd-book-quote\">&quot;속죄소를 궤 위에 얹고 내가 네게 줄 증거판을 궤 속에 넣으라 거기서 내가 너와 만나고 속죄소 위 곧 증거궤 위에 있는 두 그룹 사이에서 내가 이스라엘 자손을 위하여 네게 명령할 모든 일을 네게 이르리라&quot; (출애굽기 25장 21~22절)</blockquote>\n<p class=\"kkd-book-p\">구속사적·공간신학적 해석의 관점에서 볼 때, 언약궤 안에는 백성이 범한 십계명 두 증거판이 들어 있고 두 그룹 사이에는 거룩하신 여호와께서 임재하시는데(후대 랍비 문헌의 &#x27;쉐키나&#x27;), 일 년에 한 번 대속죄일(레위기 16장 14~15절)에 대제사장이 속죄제물의 피를 가져다가 바로 그 중간의 순금 판 <strong>&#x27;카포레트(속죄소)&#x27;</strong> 위에 뿌림으로써 심판 대신 용서와 만남이 이루어지는 은혜의 보좌(히브리서 4장 16절 참조)가 열리게 됩니다. 칠십인역(LXX) 모세오경 번역자들은 이 &#x27;카포레트&#x27;를 헬라어 <strong>&#x27;힐라스테리온(ἱλαστήριον)&#x27;</strong>으로 번역하였으며, 히브리서 9장 5절 또한 이를 그대로 이어받아 &quot;속죄소를 덮는 영광의 그룹들(κατασκιάζοντα τὸ ἱλαστήριον)&quot;이라고 기록하였습니다.</p>\n<h3 class=\"kkd-book-h3\">2.3 로마서 3장 25절과 히브리서 9장 11~12절: 참된 화목제물이자 속죄소(ἱλαστήριον)이신 예수 그리스도</h3>\n<p class=\"kkd-book-p\">이러한 구약과 칠십인역의 토대 위에서 신약 <strong>로마서 3장 25절</strong>을 읽으면 십자가 대속의 구속사적 의미가 선명해집니다.</p>\n<blockquote class=\"kkd-book-quote\">&quot;이 예수를 하나님이 그의 피로써 믿음으로 말미암는 화목제물로 세우셨으니 이는 하나님께서 길이 참으시는 중에 전에 지은 죄를 간과하심으로 자기의 의로우심을 나타내려 하심이니&quot; (로마서 3장 25절)</blockquote>\n<p class=\"kkd-book-p\">헬라어 원문 <strong>&quot;혼 프로에데토 호 데오스 힐라스테리온 디아 테스 피스테오스 엔 토 아우투 하이마티(ὃν προέθετο ὁ θεὸς ἱλαστήριον διὰ τῆς πίστεως ἐν τῷ αὐτοῦ αἵματι)&quot;</strong>에서 두 단어의 주해 논의가 중요합니다. 첫째, 동사 <strong>&#x27;프로에데토(προέθετο)&#x27;</strong>는 학계에서 ① 구약의 숨겨진 지성소 속죄소와 대조하여 하나님께서 골고다 언덕 위에 온 세상이 볼 수 있도록 <strong>&#x27;공개적으로 전시하여 세우셨다(displayed publicly)&#x27;</strong>는 해석과 ② 영원한 구원 경륜 속에서 <strong>&#x27;미리 뜻하사 정하셨다(purposed beforehand)&#x27;</strong>는 해석이 함께 제시됩니다. 둘째, 핵심 명사 <strong>&#x27;힐라스테리온(ἱλαστήρι온)&#x27;</strong>에 대하여 레온 모리스와 더글러스 무(Douglas J. Moo, 『로마서 주석』) 등은 로마서 1장 18절~3장 20절을 지배해 온 죄에 대한 하나님의 진노(<code class=\"kkd-inline-code\">ὀργὴ θεοῦ</code>) 문맥을 해결하는 단어로서 <strong>&#x27;하나님의 거룩한 진노를 유화시키는 화목제물(Propitiatory sacrifice)&#x27;</strong>의 의미를 일차적으로 강조하면서 속죄소 함의를 아우르는 반면, 페터 스툴마허(Peter Stuhlmacher)와 톰 라이트(N. T. Wright) 등은 레위기 16장 칠십인역을 배경으로 예수 그리스도 자신이 죄 사함과 언약 회복이 일어나는 종말론적 <strong>&#x27;속죄의 장소 곧 속죄소(Sühnort / Mercy Seat)&#x27;</strong>가 되셨다는 읽기에 무게를 둡니다. 두 측면은 그리스도께서 <strong>&#x27;오직 자기의 피로 영원한 속죄를 이루사 단번에(ἐφάπαξ) 성소에 들어가셨다&#x27;</strong>(히브리서 9장 12절)는 진리 안에서 조화롭게 만납니다.</p>\n<hr class=\"kkd-book-divider\"/>\n<h2>3. 교회사적 조명과 정통 신학의 통찰</h2>\n<h3 class=\"kkd-book-h3\">3.1 『디오그네투스에게 보내는 편지』 제9장과 안셀무스의 『왜 하나님이 사람이 되셨는가』</h3>\n<p class=\"kkd-book-p\">초기 교부 문헌인 2세기 <strong>『디오그네투스에게 보내는 편지(Epistle to Diognetus)』 제9장</strong>(마이클 홈즈 Michael W. Holmes 편집·번역 <em>The Apostolic Fathers</em>, 제3판, 2007 기준)은 성부 하나님의 자비로운 사랑과 성자의 대속적 교환을 감동적으로 증언합니다. 이 편지 9장 2~5절에 따르면, 우리의 불의가 가득 차 심판만 남았을 때에도 하나님께서는 <strong>&quot;우리를 미워하지도 않으시고 내치지도 않으셨으며 우리의 악을 기억하지도 않으셨고(He did not regard us with hatred, nor thrust us away, nor remember our iniquity against us)&quot;</strong>, 도리어 오래 참으시며 자비로 우리 죄를 친히 짊어지사 자기 아들을 우리를 위한 <strong>속전(λύτρον, ransom)</strong>으로 내어주셨으니, <strong>&quot;거룩하신 분을 범법자들을 위하여(the holy one for transgressors), 악이 없으신 분을 악한 자들을 위하여, 의로우신 분을 불의한 자들을 위하여&quot;</strong> 내어주셨습니다. 그리고 저자는 &quot;오 이 달콤한 교환(ὦ τῆς γλυκείας ἀνταλλαγῆς)이여... 한 분의 의가 많은 사람을 의롭다 하였도다&quot;라고 찬양합니다. 하나님께서 죄인을 미워해서가 아니라 사랑과 긍휼로 친히 속전을 마련하셨다는 진리가 초기 교회부터 분명히 고백된 것입니다.</p>\n<p class=\"kkd-book-p\">이어 11세기 캔터베리의 안셀무스(Anselm, 『왜 하나님이 사람이 되셨는가 Cur Deus Homo』, 1098)는 고대의 &#x27;마귀에게 속전을 지불했다는 가설&#x27;을 극복하고, 죄로 인해 침해된 하나님의 거룩한 도덕 질서와 공의를 참 하나님이시자 참 인간이신 그리스도의 자원하는 순종과 죽음이 온전히 만족시키셨다는 만족설의 기초를 세웠습니다.</p>\n<h3 class=\"kkd-book-h3\">3.2 종교개혁자 루터와 칼빈의 형벌 대속 신학: 하나님의 사랑에서 비롯된 화목제물</h3>\n<p class=\"kkd-book-p\">16세기 마르틴 루터와 장 칼빈은 성경 원문(이사야 53장, 로마서 3장 25절, 갈라디아서 3장 13절, 고린도후서 5장 21절)에 근거하여 그리스도께서 우리 죄에 대한 율법의 법정적 형벌과 하나님의 거룩한 진노를 대신 담당하셨다는 <strong>형벌 대속(Penal Substitution)</strong> 교리를 정립하였습니다. 칼빈은 『로마서 주석』 3장 25절에서 구약의 속죄소가 피 뿌림을 통해서만 은혜의 자리가 되었듯 하나님께서 그리스도의 피 안에서 우리와 화목하신다고 풀이하였습니다. 동시에 칼빈은 『기독교강요』 제2권 16장 3~4절에서 아우구스티누스의 『요한복음 강해』 제110편을 직접 인용하여, 마치 성부는 냉혹하고 성자가 성부를 달래어 비로소 우리를 사랑하게 만들었다는 오해를 차단하고 <strong>하나님께서 이미 타락한 우리를 먼저 측량할 수 없이 사랑하셨기 때문에(요 3:16; 요일 4:10) 자신의 공의와 사랑을 함께 이루시려고 친히 아들을 화목제물로 보내셨음</strong>을 명백히 하였습니다.</p>\n<h3 class=\"kkd-book-h3\">3.3 존 웨슬리의 『신약성경 주해(롬 3:25; 요일 2:2)』 실제 원문: 진노 유화와 온 세상에 미치는 보편 속죄</h3>\n<p class=\"kkd-book-p\">18세기 존 웨슬리(John Wesley)는 1756년 1월 6일 신비주의 사상가 윌리엄 로(William Law)에게 보낸 공개서한에서 그리스도의 대속과 법정적 속죄를 도덕적 모범으로만 환원하려는 견해를 성경적 기독교의 핵심에서 벗어난 오류로 비판하였으며, 『신약성경 주해(Explanatory Notes upon the New Testament, 1755)』 로마서 3장 25절과 요한일서 2장 2절에서 웨슬리안 보혈 속죄론의 두 기둥인 <strong>&#x27;진노 유화(Propitiation)&#x27;</strong>와 <strong>&#x27;온 세상을 향한 보편 속죄&#x27;</strong>를 명확한 문장으로 천명하였습니다.</p>\n<p class=\"kkd-book-p\">첫째, <strong>로마서 3장 25절</strong>의 &#x27;화목제물(<code class=\"kkd-inline-code\">a propitiation</code>, <code class=\"kkd-inline-code\">ἱλαστήριον</code>)&#x27;에 대하여 웨슬리는 <strong><code class=\"kkd-inline-code\">&quot;침해받으신(노하신) 하나님을 유화시키기 위함이라(To appease an offended God)&quot;</code></strong>라고 직접 풀이한 뒤, 곧이어 <strong>&quot;그러나 만일 어떤 사람이 이미 노하신 하나님께서 우리를 사랑하사 우리 죄를 위한 화목제물로 자기 아들을 보내셨다는 것은 불가능하다고 단언한다면... 하나님의 말씀은 이 두 가지 사실(하나님의 진노와 사랑)을 모두 명백히 선언한다&quot;</strong>고 덧붙여 성부의 공의로운 진노와 선재적 사랑이 성경 안에서 함께 성립함을 변증하였습니다.</p>\n<p class=\"kkd-book-p\">둘째, <strong>요한일서 2장 2절</strong>(&quot;그는 우리 죄를 위한 화목제물이니 우리만 위할 뿐 아니요 온 세상의 죄를 위하심이라&quot;) 주해에서 웨슬리는 &#x27;화목제물(<code class=\"kkd-inline-code\">ἱλασμός</code>)&#x27;을 <strong><code class=\"kkd-inline-code\">&quot;하나님의 진노가 유화되는 속죄 희생제물(The atoning sacrifice by which the wrath of God is appeased)&quot;</code></strong>로 정의하고, 개혁파의 제한 속죄론과 구별하여 <strong><code class=\"kkd-inline-code\">&quot;죄가 미치는 범위만큼이나 똑같이 넓게, 그 화목제물의 속죄도 미친다(Just as wide as sin extends, the propitiation extends also)&quot;</code></strong>라고 선언함으로써 그리스도의 대속 보혈이 온 인류 누구에게나 열려 있음을 확정하였습니다. 동생 찰스 웨슬리의 찬송시 『보좌 앞에 나아갈 때(Arise, My Soul, Arise)』 또한 갈보리에서 흘리신 보혈이 하늘 보좌 앞에서 우리를 위해 간구하므로 두려움 없이 하나님께 나아간다는 히브리서의 확신을 아름답게 노래하였습니다.</p>\n<hr class=\"kkd-book-divider\"/>\n<h2>4. 현대적 쟁점 변증과 기독교 세계관적 대안</h2>\n<h3 class=\"kkd-book-h3\">4.1 현대 신학 일각의 형벌 대속 비판(&#x27;우주적 아동학대&#x27; 담론 등)에 대한 삼위일체적 응답</h3>\n<p class=\"kkd-book-p\">20세기 후반 조앤 칼슨 브라운과 레베카 파커 등 일부 여성주의 신학자들의 문제 제기에 이어, 2003년 영국 복음주의권 내의 스티브 초크(Steve Chalke, 『예수의 잃어버린 메시지 The Lost Message of Jesus』) 등은 전통적 형벌 대속 교리가 성부 하나님을 자기 아들에게 폭력을 가해 분노를 푸는 가해자(&#x27;우주적 아동학대 cosmic child abuse&#x27;)처럼 오해하게 만든다는 비판적 논지를 제기한 바 있습니다. 이러한 문제 제기에 대하여 정통 복음주의 신학(레온 모리스, 존 스토트의 『그리스도의 십자가』 등)은 두 가지 성경적·교리적 원리로 정중하고도 명쾌하게 응답합니다.</p>\n<p class=\"kkd-book-p\">첫째, 성경이 말하는 <strong>&#x27;하나님의 진노(ὀργὴ θεοῦ)&#x27;</strong>는 통제 불능의 이기적 감정 폭발이 아니라, 피조물과 생명을 파괴하는 악과 불의에 대한 거룩하시고 사랑이 많으신 재판장의 의로운 반대입니다. 악에 대해 진노하지 않는다면 공의도 사랑도 성립할 수 없습니다. 둘째, 무엇보다도 골고다 십자가는 성부 하나님이 무관한 제3자에게 고통을 전가한 사건이 결코 아니라, <strong>니케아 삼위일체 신앙이 고백하듯 성부와 동일 본질(호모우시오스)이신 성자 하나님께서 자원하여(&quot;내가 내 목숨을 스스로 버리노라&quot;, 요 10:18) 오셨고 &quot;하나님께서 그리스도 안에 계시사 세상을 자기와 화목하게 하신&quot;(고린도후서 5장 19절) 삼위일체 하나님의 자기희생적 대속(Self-Substitution of God)</strong>입니다. 죄인을 살리시기 위해 재판장이신 하나님 자신이 친히 피고석에 내려와 형벌을 대신 받으신 이 사건이야말로 인류가 알 수 있는 가장 숭고한 거룩한 사랑의 확증입니다.</p>\n<h3 class=\"kkd-book-h3\">4.2 죄책감의 피상적 회피를 넘어 양심을 정결케 하는 십자가 보혈의 치유</h3>\n<p class=\"kkd-book-p\">현대 세속 문화는 하나님 앞에서의 객관적인 죄책을 단순한 심리적 불편함으로 축소하여 덮어 두려 하지만, 해결되지 않은 죄책은 인간 내면에 깊은 불안을 남깁니다. 성경의 &#x27;카파르&#x27;와 &#x27;힐라스테리온&#x27;은 우리의 죄가 하나님의 아들이 피 흘리셔야 할 만큼 무거웠음을 직면케 하는 동시에, 그리스도의 보혈이 그 모든 죄 값을 단번에 지불하셨음을 보여 줌으로써 &quot;죽은 행실에서 너희 양심을 깨끗하게 하고 살아 계신 하나님을 섬기게&quot;(히브리서 9장 14절) 하는 참된 치유와 자유를 부여합니다.</p>\n<hr class=\"kkd-book-divider\"/>\n<h2>5. 결론: 강단 설교와 성도의 삶을 위한 목회적 적용</h2>\n<h3 class=\"kkd-book-h3\">5.1 휘장이 찢어진 은혜의 보좌(ὁ θρόνος τῆς χάριτος) 앞으로 나아가는 특권</h3>\n<p class=\"kkd-book-p\">구약 시대의 지성소 속죄소(카포레트)는 두꺼운 휘장 뒤에 가려져 있었으나, 참된 대제사장이자 화목제물(힐라스테리온)이신 예수 그리스도께서 십자가에서 자기 육체의 휘장을 찢으심으로 모든 믿는 자에게 하나님 보좌로 나아가는 새롭고 산 길을 열어 주셨습니다.</p>\n<blockquote class=\"kkd-book-quote\">&quot;그러므로 형제들아 우리가 예수의 피를 힘입어 성소에 들어갈 담력을 얻었나니 그 길은 우리를 위하여 휘장 가운데로 열어 놓으신 새로운 살 길이요 휘장은 곧 그의 육체니라 ... 그러므로 우리는 긍휼하심을 받고 때를 따라 돕는 은혜를 얻기 위하여 은혜의 보좌 앞에 담대히 나아갈 것이니라&quot; (히브리서 10장 19~20절; 4장 16절)</blockquote>\n<h3 class=\"kkd-book-h3\">5.2 강단 설교와 성도의 일상을 위한 세 가지 목회적 적용</h3>\n<p class=\"kkd-book-p\">첫째, 설교 강단의 중심에는 도덕적 처세술을 넘어 언제나 구약의 제사와 성막을 완성하신 예수 그리스도의 십자가 대속 보혈(&#x27;힐라스테리온&#x27;)이 선명하게 선포되어야 합니다.</p>\n<p class=\"kkd-book-p\">둘째, 성도는 기도의 자리에 나아갈 때마다 내 공로를 의지하지 말고 오직 예수의 피를 힘입어 은혜의 보좌 앞으로 나아가야 합니다. 누가복음 18장 13절에서 세리가 &quot;하나님이여 불쌍히 여기소서 나는 죄인이로소이다&quot;라고 기도할 때 사용한 헬라어 동사 <strong>&#x27;힐라스테티 모이(ἱλάσθητί μοι, 내게 자비를 베푸사 내 죄를 속하소서)&#x27;</strong>는 바로 &#x27;힐라스테리온(속죄소·화목제물)&#x27;과 동일한 어근(<code class=\"kkd-inline-code\">ἱλάσκομαι</code>)에서 나온 단어로, 설교적으로는 하나님의 대속 은혜만을 전적으로 의지하는 회개의 기도를 보여 줍니다.</p>\n<p class=\"kkd-book-p\">셋째, 그리스도의 피로 하나님과 화목하게 된 성도는 가정과 교회, 세상 속에서 &#x27;화목하게 하는 직분&#x27;(고린도후서 5장 18~19절)을 감당하며 형제의 허물을 십자가 사랑으로 용서하고 품어 주는 화평의 통로가 되기를 소망합니다.</p>\n<h3 class=\"kkd-book-h3\">5.3 참고 사료 및 학술 문헌 목록</h3>\n<ul class=\"kkd-book-list\">\n<li><strong>1차 성경 원문 및 고전 신학 문헌:</strong></li>\n<li>Holmes, Michael W., ed. (2010), <em>The Greek New Testament: SBL Edition (SBLGNT)</em>, Atlanta: Society of Biblical Literature.</li>\n<li><em>Epistle to Diognetus</em> (Ch. 9), in <em>The Apostolic Fathers: Greek Texts and English Translations</em>, ed. and trans. Michael W. Holmes, 3rd ed., Grand Rapids: Baker Academic, 2007.</li>\n<li>Anselm of Canterbury (1998), <em>Why God Became Man (Cur Deus Homo)</em>, Oxford: Oxford University Press.</li>\n<li>Calvin, John (1960), <em>Institutes of the Christian Religion (1559)</em>, Book II, Chap. 16, Philadelphia: Westminster Press.</li>\n<li>Wesley, John (1755), <em>Explanatory Notes upon the New Testament</em> (Romans 3:25; Hebrews 9; 1 John 2:2), London: William Bowyer.</li>\n<li><strong>현대 성경 원어학 및 속죄 신학 연구서:</strong></li>\n<li>Dodd, C. H. (1935), <em>The Bible and the Greeks</em>, London: Hodder &amp; Stoughton.</li>\n<li>Morris, Leon (1965), <em>The Apostolic Preaching of the Cross</em>, 3rd rev. ed. (1st ed. 1955), Grand Rapids: Eerdmans.</li>\n<li>Nicole, Roger R. (1955), &quot;C. H. Dodd and the Doctrine of Propitiation&quot;, <em>Westminster Theological Journal</em> 17, no. 2: 117~157.</li>\n<li>Milgrom, Jacob (1991), <em>Leviticus 1~16</em>, Anchor Bible, Vol. 3, New York: Doubleday.</li>\n<li>Wenham, Gordon J. (1979), <em>The Book of Leviticus</em>, NICOT, Grand Rapids: Eerdmans.</li>\n<li>Sklar, Jay (2005), <em>Sin, Impurity, Sacrifice, Atonement: The Priestly Conceptions</em>, Sheffield: Sheffield Phoenix Press.</li>\n<li>Stott, John R. W. (1986), <em>The Cross of Christ</em>, Leicester: Inter-Varsity Press.</li>\n<li>Moo, Douglas J. (2018), <em>The Letter to the Romans</em>, 2nd ed., NICNT, Grand Rapids: Eerdmans.</li>\n<li>Lang, Bernhard (1995), &quot;כָּפַר (kāpar) / כַּפֹּרֶת (kappōret)&quot;, in <em>TDOT</em>, Vol. 7, Grand Rapids: Eerdmans.</li>\n</ul>\n<hr class=\"kkd-book-divider\"/>", "peer_review_html": "\n        <div class=\"review-box\">\n            <div class=\"review-badge an-badge\">🏛️ 1차 원어·사료 DB 검증 내역 (클간사 (Claude · 1차 교차검수 완료) · 안관장 (B등급 승격 확정))</div>\n            <div class=\"review-body\">\n                <p>[B등급 정식 공개 승격 완료] 클간사 필수 보완 5건(시 32:1 카사[H3680]와 카파르 구별, 창 6:14 동음이의 어근 구분, 웨슬리 롬 3:25·요일 2:2 실제 주해 교체, 디오그네투스 9장 원문 대조, 학자별 주장 세분화) 반영·저자 응답 등재 완료 (2026-11-10)</p>\n            </div>\n        </div>\n        <div class=\"review-box\">\n            <div class=\"review-badge ji-badge\">💬 검수자의 학술·신학 질문</div>\n            <div class=\"review-body\">\n                <p>이 논고는 대속죄일의 피를 형벌과 진노를 대신 받는 대속으로 읽습니다. 그런데 레위기 16장에는 두 마리 염소가 나옵니다. 피를 바른 염소와, 백성의 죄를 광야로 지고 가는 아사셀 염소입니다. 일부 학자(밀그롬 등)는 대속죄일의 피가 사람이 아니라 성소의 부정을 씻는 것이라고 읽습니다. 이 읽기를 받아들이면 &#x27;카파르 = 진노를 달래는 대속&#x27;이라는 이 논고의 중심 논지는 어떻게 되며, 아사셀 염소는 이 구속사 서술에서 어디에 놓입니까?</p>\n            </div>\n        </div>\n        <div class=\"review-box\">\n            <div class=\"review-badge an-badge\">✍️ 저자의 응답 및 판본 상태</div>\n            <div class=\"review-body\">\n                <p>제이 스클라와 리처드 애버벡이 규명했듯, 성소의 오염을 피로 정화하는 것(정결/속죄)과 거룩하신 하나님의 심판 진노로부터 백성의 생명을 건지는 것(대속/진노 유화)은 분리된 두 사건이 아니라 한 속죄 사건의 양면입니다. 또한 레위기 16장의 두 염소는 하나의 속죄 제의(16:5, 10)를 이루는 두 국면으로서, 첫째 염소가 그리스도의 보혈을 통한 속죄소(힐라스테리온)의 피 뿌림을 보여 준다면 아사셀 염소는 영문 밖에서 우리의 죄책을 영원히 옮겨 제거하신(요 1:29, 히 13:12) 속죄의 완성을 입체적으로 예표합니다.</p>\n            </div>\n        </div>\n    "}];

let currentPaperId = "JI001";
let currentFilter = "all";

function renderList() {
  const container = document.getElementById("paper-list");
  container.innerHTML = "";
  
  const filtered = PAPERS.filter(p => currentFilter === "all" || p.grade === currentFilter);
  
  filtered.forEach(p => {
    const item = document.createElement("div");
    item.className = `paper-item ${p.id === currentPaperId ? 'active' : ''}`;
    item.onclick = () => selectPaper(p.id);
    
    item.innerHTML = `
      <div class="paper-item-header">
        <span class="paper-id">${p.id}</span>
        <span class="badge badge-grade-${p.grade.toLowerCase()}">${p.grade_badge.split(' ')[0]} ${p.grade}등급</span>
      </div>
      <div class="paper-item-title">${p.title}</div>
      <div class="paper-item-meta">
        <span>${p.author.split('(')[0]}</span>
        <span>${p.words} · ${p.date}</span>
      </div>
    `;
    container.appendChild(item);
  });
}

function selectPaper(id) {
  currentPaperId = id;
  renderList();
  renderReader();
}

function filterGrade(grade) {
  currentFilter = grade;
  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.classList.toggle("active", btn.textContent.includes(grade) || (grade === 'all' && btn.textContent === '전체'));
  });
  renderList();
}

function renderReader() {
  const p = PAPERS.find(x => x.id === currentPaperId);
  if (!p) return;
  
  const root = document.getElementById("reader-root");
  root.innerHTML = `
    <div class="paper-masthead">
      <div class="masthead-meta">
        <span class="masthead-id">${p.id}</span>
        <span class="masthead-hall">${p.hall_name}</span>
        <span class="badge badge-grade-${p.grade.toLowerCase()}">${p.grade_badge}</span>
      </div>
      <div class="masthead-title">${p.title}</div>
      <div class="masthead-subtitle">${p.subtitle}</div>
      <div class="masthead-author-row">
        <span><strong>연구자:</strong> ${p.author}</span>
        <span><strong>작성일:</strong> ${p.date} | <strong>분량:</strong> ${p.words}</span>
      </div>
    </div>

    <div class="rq-box">
      <div class="rq-label">Core Research Question · 핵심 연구 질문</div>
      <div class="rq-text">"${p.core_q}"</div>
    </div>

    <div class="paper-body">
      ${p.content_html}
    </div>

    <div class="peer-review-section">
      <div class="peer-review-title">
        💬 열린 학당: 동료 평가 (Peer-Review) 및 저자의 응답
      </div>
      <div class="peer-review-sub">
        꿈디도 제2별관은 연구의 결론뿐 아니라 검증 과정과 이견을 투명하게 공개하여 독자와 함께 사유합니다.
      </div>
      ${p.peer_review_html}
    </div>
  `;
}

// 초기화
renderList();
renderReader();
</script>

</body>
</html>
