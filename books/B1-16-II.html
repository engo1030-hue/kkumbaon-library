  <title>[꿈바온 서가] [성경개관 16권 · 제2작업반 심화편] 느헤미야(Nehemiah) 구속사 심층 개관 — 눈물의 금식 중보기도와 오십이 일 만의 예루살렘 성벽 완공(느 1~6장), 수문 앞 광장 말씀 대부흥(&quot;여호와로 인하여 기뻐하는 것이 너희의 힘이니라&quot;, 느 8:10), 그리고 언약 인봉과 공동체 성결 개혁(느 9~13장) — 꿈바온 디지털 도서관</title>
  <meta name="description" content="백사십 년 동안 무너진 채 방치되어 있던 예루살렘 성벽이 어떻게 단 오십이 일 만에 재건될 수 있었으며 물리적 성벽 완공 이후 느헤미야와 에스라는 왜 곧바로 수문 앞 광장 말씀 집회를 열었는가라는 질문에 대하여, 느헤미야서는 철저한 눈물의 기도와 치밀한 실행력, 그리고 약자의 고통을 외면하... (집필: 제간사 · 분량: 13,729자 · 꿈디도 열린 학술원)" />
