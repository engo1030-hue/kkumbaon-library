  <title>[꿈바온 서가] [성경개관 42권] 누가복음(Luke) 구속사 심층 개관 — 역사가 누가의 치밀한 복음 확증(눅 1:1~4), 나사렛 희년 선언(눅 4:18~19), 잃어버린 자를 찾아 구원하시는 인자(눅 15장; 19:10), 그리고 엠마오 성경 해석(눅 24:27, 44) — 꿈바온 디지털 도서관</title>
  <meta name="description" content="신약 성경 저자 중 유일한 이방인 의사였던 누가는 로마 지성인 데오빌로와 온 세계 이방 독자들에게 예수 그리스도의 복음을 어떻게 변증하였으며 누가복음만의 고유한 구속사적 빛깔은 무엇인가라는 질문에 대하여, 누가복음은 세계사 연대기 한복판에서 검증된 정확한 역사 서술(눅 1:1~4; 3:1~... (집필: 제간사 · 분량: 15,995자 · 꿈디도 열린 학술원)" />
