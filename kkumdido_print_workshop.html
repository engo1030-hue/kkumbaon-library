<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>주보·전도지 공방 | 꿈디도 교회지원별관</title>
  <meta name="description" content="주보, 전도지, 대표기도문, 교회 행정 서식을 만들고 인쇄하는 무료 공방">
  <style>
    :root{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#203027;background:#f4f1e9}
    *{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}
    a{color:inherit}header{background:#17352b;color:#fff;padding:20px max(20px,calc((100vw - 1280px)/2))}
    .topline{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
    .topline a{font-size:.9rem;text-decoration:none;border:1px solid #95b8a7;border-radius:8px;padding:8px 12px}
    h1{font-family:Georgia,"Nanum Myeongjo",serif;font-size:clamp(1.65rem,3vw,2.35rem);margin:14px 0 7px}
    header p{margin:0;color:#d6e7d9;line-height:1.6}
    main{max-width:1280px;margin:auto;padding:24px 20px 50px}
    .notice{background:#e9f3eb;border-left:4px solid #327a50;padding:12px 16px;border-radius:8px;line-height:1.55;margin-bottom:18px}
    .tabs{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}
    .tabs button{border:1px solid #b8c9bb;border-radius:999px;padding:10px 16px;background:#fff;color:#254335;font-weight:700}
    .tabs button[aria-selected="true"]{background:#215941;color:#fff;border-color:#215941}
    .layout{display:grid;grid-template-columns:minmax(310px,420px) minmax(0,1fr);gap:20px;align-items:start}
    .editor,.preview-wrap{background:#fff;border:1px solid #d8dfd7;border-radius:16px;box-shadow:0 5px 18px #17352b0b}
    .editor{padding:22px}.editor h2,.preview-wrap h2{font-size:1.17rem;margin:0 0 6px}
    .help{color:#587062;font-size:.88rem;line-height:1.55;margin:0 0 17px}
    .field{margin:0 0 14px}.field label{display:block;font-weight:700;margin-bottom:5px;font-size:.91rem}
    .field input,.field select,.field textarea{width:100%;border:1px solid #aebdb2;border-radius:8px;padding:10px;background:#fff;color:#203027}
    .field textarea{min-height:88px;resize:vertical;line-height:1.5}
    .field input:focus,.field select:focus,.field textarea:focus,.tabs button:focus-visible,.actions button:focus-visible{outline:3px solid #d2a956;outline-offset:2px}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
    .actions button{border:1px solid #215941;border-radius:8px;padding:10px 14px;background:#215941;color:#fff;font-weight:700}
    .actions button.secondary{background:#fff;color:#215941}.actions button:disabled{opacity:.45;cursor:not-allowed}
    #status{min-height:1.5em;margin:12px 0 0;color:#8a3d20;font-size:.88rem}
    .preview-wrap{padding:20px;background:#e7e9e3}.preview-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}
    .preview-head small{color:#52675a}.sheet{background:#fff;color:#243026;width:100%;max-width:740px;min-height:930px;margin:auto;padding:48px 52px;box-shadow:0 8px 24px #0002;overflow-wrap:anywhere}
    .sheet .eyebrow{color:#377554;font-weight:800;letter-spacing:.13em;font-size:.75rem}.sheet h2{font-family:Georgia,"Nanum Myeongjo",serif;font-size:2rem;margin:10px 0 16px;line-height:1.3}
    .sheet h3{font-size:1rem;border-bottom:1px solid #9db4a2;padding-bottom:6px;margin:26px 0 8px}
    .sheet p,.sheet li{line-height:1.75}.sheet .muted{color:#627167}.sheet .rule{height:4px;background:#286247;margin:20px 0}
    .sheet .cols{display:grid;grid-template-columns:1fr 1fr;gap:24px}.sheet .block{white-space:pre-wrap;line-height:1.7}
    .sheet footer{margin-top:38px;border-top:1px solid #a9b8aa;padding-top:12px;font-size:.84rem;color:#536659}
    .sheet.flyer{border-top:16px solid #286247}.sheet.flyer .invitation{background:#eef4ed;border-radius:12px;padding:18px;margin:26px 0}
    .sheet.flyer[data-season="easter"]{border-top-color:#b58c28}.sheet.flyer[data-season="christmas"]{border-top-color:#9e4343}.sheet.flyer[data-season="harvest"]{border-top-color:#9a7130}
    @media(max-width:850px){.layout{grid-template-columns:1fr}.sheet{min-height:0;padding:28px 24px}.sheet .cols{grid-template-columns:1fr}main{padding:16px 12px 34px}.editor,.preview-wrap{padding:16px}}
    @media print{@page{size:A4;margin:0}header,main>.notice,.tabs,.editor,.preview-head{display:none!important}main,.layout,.preview-wrap{display:block;margin:0;padding:0;border:0;box-shadow:none;background:#fff}.sheet{width:210mm;max-width:none;min-height:297mm;margin:0;padding:20mm;box-shadow:none;border-radius:0;print-color-adjust:exact;-webkit-print-color-adjust:exact}}
  </style>
</head>
<body>
<header>
  <div class="topline"><strong>🏛️ 꿈디도 교회지원별관 · 살림채</strong><a href="kkumdido_church_support_annex.html">← 별관으로 돌아가기</a></div>
  <h1>주보·전도지 공방</h1>
  <p>주보, 전도지, 대표기도문과 행정 서식을 한 장씩 살펴보고 인쇄합니다.</p>
</header>
<main>
  <p class="notice">입력한 내용은 이 화면의 미리보기에만 사용하며 서버로 보내거나 자동 저장하지 않습니다. 새로고침하면 사라집니다. 인쇄 창에서 PDF로 저장할 수 있습니다.</p>
  <nav class="tabs" aria-label="공방 작업 선택" role="tablist">
    <button type="button" role="tab" id="tab-bulletin" aria-controls="editor" aria-selected="true" data-kind="bulletin">📰 주보</button>
    <button type="button" role="tab" id="tab-flyer" aria-controls="editor" aria-selected="false" data-kind="flyer">🌿 전도지</button>
    <button type="button" role="tab" id="tab-prayer" aria-controls="editor" aria-selected="false" data-kind="prayer">🙏 대표기도문</button>
    <button type="button" role="tab" id="tab-admin" aria-controls="editor" aria-selected="false" data-kind="admin">📋 행정 서식</button>
  </nav>
  <div class="layout">
    <section class="editor" id="editor" role="tabpanel" aria-labelledby="tab-bulletin">
      <h2 id="editor-title">주보 만들기</h2><p class="help" id="editor-help"></p>
      <form id="work-form" novalidate></form>
      <div class="actions">
        <button type="button" class="secondary" id="draft-btn" hidden>✍️ 기도문 초안 만들기</button>
        <button type="button" id="print-btn">🖨️ 인쇄 · PDF 저장</button>
        <button type="button" class="secondary" id="copy-btn">📋 내용 복사</button>
        <button type="button" class="secondary" id="clear-btn">입력 지우기</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
    <section class="preview-wrap" aria-label="인쇄 미리보기">
      <div class="preview-head"><h2>인쇄 미리보기</h2><small>내용을 고치면 바로 반영됩니다</small></div>
      <article class="sheet" id="sheet"></article>
    </section>
  </div>
</main>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const today = new Date().toLocaleDateString('sv-SE', {timeZone:'Asia/Seoul'});
  const models = {
    bulletin:{title:'주보 만들기',help:'예배 순서와 설교·교회 소식을 적어 A4 주보로 인쇄합니다.',fields:[
      ['church','교회 이름','text','',true],['date','예배 날짜','date',today,true],['sermon','설교 제목','text','',true],['verse','성경 본문','text','',true],
      ['preacher','설교자','text','',false],['prayerLead','대표기도','text','',false],['order','예배 순서','textarea','예배로 부름\n찬송\n대표기도\n성경봉독\n설교\n봉헌\n축도',false],
      ['news','교회 소식 (한 줄에 하나씩)','textarea','',false],['contact','교회 연락처 · 주소','textarea','',false]]},
    flyer:{title:'전도지 만들기',help:'절기를 고른 뒤 문구와 초청 정보를 직접 확인해 A4 전도지로 인쇄합니다.',fields:[
      ['season','절기','select','general',false],['church','교회 이름','text','',true],['headline','전도지 제목','text','',true],['verse','성경 본문 표기','text','',false],
      ['message','복음 안내 문구','textarea','',true],['invitation','초청 문구','textarea','',false],['service','예배 시간 · 장소','textarea','',false],['contact','연락처 · 홈페이지','textarea','',true]]},
    prayer:{title:'대표기도문 준비하기',help:'기도 제목을 적고 초안을 만든 뒤 문장을 직접 고쳐 인쇄합니다.',fields:[
      ['church','교회 이름','text','',true],['date','예배 날짜','date',today,false],['theme','기도 제목 · 이번 주 형편','textarea','',true],
      ['intercession','함께 기도할 대상과 사역','textarea','',false],['body','대표기도문','textarea','',true]]},
    admin:{title:'행정 서식 만들기',help:'회의록·협조 공문·행사 계획서 중 필요한 양식을 고릅니다.',fields:[
      ['formType','서식 종류','select','minutes',false],['church','교회 이름','text','',true],['date','작성일','date',today,true],['title','문서 제목','text','',true],
      ['recipient','받는 곳 또는 참석자','text','',false],['writer','작성자','text','',false],['body','안건 · 요청 내용 · 계획','textarea','',true],['followup','결정 사항 · 후속 일정','textarea','',false]]}
  };
  const selectOptions={season:[['general','일반'],['easter','부활절'],['christmas','성탄절'],['harvest','추수감사절']],formType:[['minutes','회의록'],['letter','협조 요청 공문'],['plan','행사 계획서']]};
  const seasonPreset={
    general:{headline:'당신을 예배의 자리로 초대합니다',verse:'요한복음 3:16',message:'하나님은 우리를 사랑하셔서 예수 그리스도를 보내셨습니다. 예수님의 십자가와 부활 안에 죄 사함과 새 삶의 소망이 있습니다. 말씀을 듣고 함께 질문하며 예배의 자리에서 이 기쁜 소식을 만나 보십시오.',invitation:'처음 오시는 분도 편히 오실 수 있습니다.'},
    easter:{headline:'부활의 소망을 함께 나눕니다',verse:'고린도전서 15:20',message:'예수 그리스도의 부활은 죽음이 끝이 아니라는 복음의 선포입니다. 주님께서 여신 새 생명의 소망을 부활절 예배에서 함께 나눕니다.',invitation:'부활절 예배에 이웃과 함께 오십시오.'},
    christmas:{headline:'큰 기쁨의 소식을 함께 듣습니다',verse:'누가복음 2:10–11',message:'예수 그리스도의 오심은 하나님께서 우리 가운데 가까이 오신 은혜의 소식입니다. 성탄의 기쁨을 예배와 교제 속에서 함께 나눕니다.',invitation:'성탄절 예배에 가족과 이웃을 초대합니다.'},
    harvest:{headline:'감사로 주님 앞에 나아갑니다',verse:'시편 100:4',message:'우리의 삶을 돌보시는 하나님께 감사를 드립니다. 받은 은혜를 기억하고 이웃과 나누는 추수감사절 예배에 함께해 주십시오.',invitation:'감사의 자리에 여러분을 초대합니다.'}
  };
  let kind='bulletin'; const values={};
  const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const lines = s => esc(s).replace(/\n/g,'<br>');
  const val = key => (values[kind]||{})[key] || '';
  const show = key => val(key) ? lines(val(key)) : '<span class="muted">미입력</span>';
  function ensureValues(k){if(!values[k]) values[k]=Object.fromEntries(models[k].fields.map(f=>[f[0],f[3]]));}
  function renderForm(){
    ensureValues(kind); const m=models[kind]; $('editor-title').textContent=m.title; $('editor-help').textContent=m.help;
    $('editor').setAttribute('aria-labelledby','tab-'+kind);
    $('work-form').innerHTML=m.fields.map(([key,label,type,,required])=>{
      const id='field-'+key;
      let control= type==='textarea' ? `<textarea id="${id}" name="${key}" rows="${key==='body'?10:4}"></textarea>`
        : type==='select' ? `<select id="${id}" name="${key}">${selectOptions[key].map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select>`
        : `<input id="${id}" name="${key}" type="${type}" ${required?'required':''}>`;
      return `<div class="field"><label for="${id}">${label}${required?' *':''}</label>${control}</div>`;
    }).join('');
    for(const [key,value] of Object.entries(values[kind])){const el=$('field-'+key);if(el) el.value=value;}
    $('status').textContent='';$('draft-btn').hidden=kind!=='prayer';renderSheet();
  }
  function renderSheet(){
    const church=show('church'); const date=show('date'); const title=show('title'); let html='';
    if(kind==='bulletin') html=`<div class="eyebrow">SUNDAY WORSHIP · 주일예배</div><h2>${church} 주보</h2><p>${date}</p><div class="rule"></div><h3>예배 순서</h3><div class="block">${show('order')}</div><h3>오늘의 말씀</h3><p><strong>${show('sermon')}</strong><br>${show('verse')}<br>설교자 ${show('preacher')} · 대표기도 ${show('prayerLead')}</p><h3>교회 소식</h3><div class="block">${show('news')}</div><footer>${show('contact')}</footer>`;
    if(kind==='flyer') html=`<div class="eyebrow">GOOD NEWS · 초청 전도지</div><h2>${show('headline')}</h2><p class="muted">${show('verse')}</p><div class="rule"></div><div class="block">${show('message')}</div><div class="invitation"><strong>${show('invitation')}</strong></div><h3>함께 예배드립니다</h3><p>${church}<br>${show('service')}</p><footer>${show('contact')}</footer>`;
    if(kind==='prayer') html=`<div class="eyebrow">WORSHIP PRAYER · 대표기도</div><h2>${church} 대표기도문</h2><p>${date}</p><div class="rule"></div><div class="block">${show('body')}</div><footer>기도 제목: ${show('theme')}</footer>`;
    if(kind==='admin'){
      const label={minutes:'회의록',letter:'협조 요청 공문',plan:'행사 계획서'}[val('formType')]||'행정 서식';
      html=`<div class="eyebrow">CHURCH DOCUMENT · ${label}</div><h2>${title}</h2><p>${church} · ${date}</p><div class="rule"></div><div class="cols"><p><strong>${val('formType')==='letter'?'수신':'참석·담당'}</strong><br>${show('recipient')}</p><p><strong>작성자</strong><br>${show('writer')}</p></div><h3>${val('formType')==='minutes'?'안건과 논의':'내용'}</h3><div class="block">${show('body')}</div><h3>${val('formType')==='minutes'?'결정 사항':'후속 일정'}</h3><div class="block">${show('followup')}</div><footer>${church}</footer>`;
    }
    $('sheet').className='sheet '+(kind==='flyer'?'flyer':'');$('sheet').dataset.season=kind==='flyer'?val('season'):'';$('sheet').innerHTML=html;
  }
  function missing(){return models[kind].fields.filter(f=>f[4]&&!val(f[0]).trim()).map(f=>f[1]);}
  function ready(){const m=missing();if(m.length){$('status').textContent='필수 입력: '+m.join(', ');$('field-'+models[kind].fields.find(f=>f[1]===m[0])[0]).focus();return false;}$('status').textContent='';return true;}
  function plainText(){return $('sheet').innerText.replace(/\n{3,}/g,'\n\n').trim();}
  document.querySelectorAll('[role="tab"]').forEach(btn=>btn.addEventListener('click',()=>{
    kind=btn.dataset.kind;document.querySelectorAll('[role="tab"]').forEach(b=>b.setAttribute('aria-selected',String(b===btn)));renderForm();
  }));
  $('work-form').addEventListener('submit',e=>e.preventDefault());
  $('work-form').addEventListener('input',e=>{if(!e.target.name)return;values[kind][e.target.name]=e.target.value;renderSheet();});
  $('work-form').addEventListener('change',e=>{
    if(!e.target.name)return;values[kind][e.target.name]=e.target.value;
    if(kind==='flyer'&&e.target.name==='season'){
      const next=seasonPreset[e.target.value];for(const key of ['headline','verse','message','invitation']){values.flyer[key]=next[key];$('field-'+key).value=next[key];}
    }
    renderSheet();
  });
  $('print-btn').addEventListener('click',()=>{if(ready())window.print();});
  $('copy-btn').addEventListener('click',async()=>{if(!ready())return;try{await navigator.clipboard.writeText(plainText());$('status').textContent='내용을 복사했습니다.';}catch{$('status').textContent='복사할 수 없습니다. 미리보기에서 직접 선택해 복사해 주세요.';}});
  $('clear-btn').addEventListener('click',()=>{values[kind]=Object.fromEntries(models[kind].fields.map(f=>[f[0],f[3]]));if(kind==='prayer')values.prayer.body='';renderForm();});
  function prayerDraft(){
    const theme=val('theme').trim();const people=val('intercession').trim();
    if(!theme){$('status').textContent='먼저 기도 제목을 적어 주세요.';$('field-theme').focus();return;}
    values.prayer.body=`거룩하신 하나님 아버지, 오늘도 저희를 예배의 자리로 불러 주셔서 감사합니다.\n\n지난 한 주를 돌아보며 저희의 부족함을 주님 앞에 고백합니다. 예수 그리스도의 은혜로 저희를 새롭게 하여 주시옵소서.\n\n오늘 주님께 올려 드릴 기도 제목은 다음과 같습니다.\n${theme}\n\n이 일에 주님의 지혜와 평안을 허락하여 주시옵고, 저희가 말씀을 듣고 순종하게 하여 주시옵소서.${people?'\n\n특별히 다음 대상과 사역을 기억합니다.\n'+people+'\n이 가운데 주님의 위로와 힘을 더하여 주시옵소서.':''}\n\n말씀을 전하시는 이와 예배하는 모든 이의 마음을 붙들어 주시옵소서. 예수 그리스도의 이름으로 기도드립니다. 아멘.`;
    $('field-body').value=values.prayer.body;renderSheet();$('status').textContent='기도문 초안을 만들었습니다. 문장을 살피고 고쳐 주세요.';
  }
  $('draft-btn').addEventListener('click',prayerDraft);
  ensureValues('flyer');Object.assign(values.flyer,seasonPreset.general);renderForm();
})();
</script>
</body>
</html>
